<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Partyverse - 3D Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        #container { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }
        .overlay-panel {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); display: none;
            flex-direction: column; gap: 1rem; background-color: rgba(0, 0, 0, 0.85);
            padding: 2rem; border-radius: 1rem; text-align: center;
            max-width: 90vw;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .btn {
            color: white; padding: 1rem 2rem; border-radius: 9999px;
            font-size: 1.125rem; font-weight: 600; border: none; cursor: pointer;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.2s ease-in-out;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { background-color: #6b7280; cursor: not-allowed; transform: none; }
        #diceButton { background-color: #4f46e5; }
        #diceButton:hover { background-color: #4338ca; }
        #message {
            color: white; font-size: 1.5rem; font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background-color: rgba(0,0,0,0.5);
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
        }
        .faceoffBtn { background-color: #ef4444; }
        .faceoffBtn:hover { background-color: #dc2626; }
        #playerHand {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            pointer-events: none;
        }
        .card {
            background-color: #fff;
            border: 3px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem;
            width: 150px;
            height: 210px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-12px) scale(1.05);
            border-color: #3b82f6;
        }
        .card-title {
            font-weight: 700;
            font-size: 1rem;
            color: #111827;
        }
        .card-desc {
            font-size: 0.875rem;
            color: #4b5563;
        }
        #cardPiles {
            position: absolute;
            bottom: 1rem;
            left: 3rem;
            display: flex;
            gap: 2rem;
            pointer-events: none;
        }
        .card-pile-outline {
            width: 100px;
            height: 140px;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .draw-pile {
            border: none;
            background-color: rgba(59,130,246,0.3);
        }
        .discard-pile {
            border: none;
            background-color: rgba(239,68,68,0.3);
        }
        .pile-label {
            color: white;
            font-weight: 700;
            font-size: 1.25rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }
        .player-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .player-thumb {
            width: 80px;
            height: 80px;
            border-radius: 0.5rem;
            background-color: #1f2937;
            border: 2px solid #fff;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div id="playerSelect" class="overlay-panel" style="display:flex;">
            <div class="text-white text-lg font-bold mb-4">Choose Your Character</div>
            <div class="flex gap-4">
                <div class="player-slot">
                    <div class="player-thumb"></div>
                    <button class="btn player-select-btn" data-player="0">Jonah</button>
                </div>
                <div class="player-slot">
                    <div class="player-thumb"></div>
                    <button class="btn player-select-btn" data-player="1">Kyle</button>
                </div>
                <div class="player-slot">
                    <div class="player-thumb"></div>
                    <button class="btn player-select-btn" data-player="2">Rochelle</button>
                </div>
                <div class="player-slot">
                    <div class="player-thumb"></div>
                    <button class="btn player-select-btn" data-player="3">Vickie</button>
                </div>
            </div>
        </div>
        <div id="ui">
            <div id="message">Player 1's Turn!</div>
        </div>
        <div id="playerHand"></div>
        <div id="cardPiles">
            <div class="card-pile-outline draw-pile">
                <div class="pile-label">DRAW</div>
            </div>
            <div class="card-pile-outline discard-pile">
                <div class="pile-label">DISCARD</div>
            </div>
        </div>
        <div id="minigameFaceoff" class="overlay-panel">
            <div id="faceoffMessage" class="text-white text-xl font-bold mb-2">FACE-OFF!</div>
            <div id="faceoffPlayers" class="text-white text-md mb-4"></div>
            <button id="startFaceoffBtn" class="btn faceoffBtn">Start Minigame!</button>
        </div>
        <div id="discardChoice" class="overlay-panel">
            <div id="discardMessage" class="text-white text-lg font-semibold mb-2">Choose a card to discard!</div>
            <div id="discardCardContainer" class="flex gap-4 flex-wrap justify-center"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@18.6.4/dist/tween.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

    <script>
        // === SCENE & PHYSICS SETUP ===
        let scene, camera, renderer, controls, world;
        const container = document.getElementById('container');
        let dice = [];
        let isRollInProgress = false;
        let timeSinceRest = 0;
        let ambientLight, directionalLight, sun, moon, minimapRenderer, minimapCamera;
        const stars = [];
        let timeOfDay = 0;

        // === GAME STATE ===
        const boardSpaces = [];
        const players = [];
        const PLAYER_Y_OFFSET = 0.6;
        const PLAYER_SCALE = 1.5;
        const PLAYER_START_OFFSET = 0.6 * (PLAYER_SCALE / 0.5);
        const PLAYER_MOVE_OFFSET = PLAYER_START_OFFSET / 2;
        const PLAYER_PULSE_SCALE = 1.3;
        let playersLoaded = 0;
        let activePlayerIndex = 0;
        const diceTrayPos = new THREE.Vector3(0, 10, -15); // This seems unused if dice tray is at (0,10,0)
        const gameViews = {
            board: { cameraPos: new THREE.Vector3(5, 8, 5), controlsTarget: new THREE.Vector3(0, 0, 0) },
            diceTray: { cameraPos: new THREE.Vector3(0, 15, 15), controlsTarget: new THREE.Vector3(0, 10, 0) }
        };
        let currentView = 'board';
        let isCameraTransition = false;
        let turnActionQueue = [];

        // === CARD GAME STATE ===
        let deck = [];
        let discardPile = [];
        let playerHands = [[], [], [], []];
        let drawPile3D, discardPile3D;

        // === AUDIO STATE ===
        let synth;
        const musicalScale = ['C4', 'D4', 'E4', 'G4', 'A4', 'C5'];
        let noteCounter = 0;

        function init(selectedIndex) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 10, 60);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.copy(gameViews.board.cameraPos);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.copy(gameViews.board.controlsTarget);
            controls.enableDamping = true;

            ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(20, 40, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.top = 30;
            directionalLight.shadow.camera.bottom = -30;
            directionalLight.shadow.camera.left = -30;
            directionalLight.shadow.camera.right = 30;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            const textureLoader = new THREE.TextureLoader();
            const grassTexture = textureLoader.load('assets/grass_texture.png');
            grassTexture.wrapS = THREE.RepeatWrapping;
            grassTexture.wrapT = THREE.RepeatWrapping;
            grassTexture.repeat.set(10, 10);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(60, 60),
                new THREE.MeshLambertMaterial({ map: grassTexture })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            createBoard();
            createPlayers(selectedIndex); // Using the more complex version
            playerHands = [[], [], [], []];
            initPhysics(); // Using the non-minified version
            initCardGame(); // Using the full implementation

            // createClouds(); // This function was duplicated, using the one in createEnvironment
            createEnvironment();
            
            synth = new Tone.Synth().toDestination();

            window.addEventListener('resize', onWindowResize, false);
            const diceButton = document.createElement('button');
            diceButton.id = 'diceButton';
            diceButton.className = 'btn';
            diceButton.innerText = 'Roll Dice';
            document.getElementById('ui').appendChild(diceButton);
            diceButton.addEventListener('click', startDiceRoll);
            diceButton.disabled = true;
            document.getElementById('ui').style.opacity = "0";

            // Minimap setup was in updateHandUI, moving to init
            minimapRenderer = new THREE.WebGLRenderer({ antialias: true });
            minimapRenderer.setSize(200, 200);
            minimapRenderer.domElement.style.position = 'absolute';
            minimapRenderer.domElement.style.right = '1rem';
            minimapRenderer.domElement.style.bottom = '1rem';
            minimapRenderer.domElement.style.border = '2px solid white';
            minimapRenderer.domElement.style.borderRadius = '0.5rem';
            container.appendChild(minimapRenderer.domElement);
            minimapCamera = new THREE.OrthographicCamera(-20,20,20,-20,0.1,100);
            minimapCamera.position.set(0,50,0);
            minimapCamera.lookAt(0,0,0);

            animate();
        }
        
        // --- (All other functions remain largely the same) ---

        function initCardGame() {
            const cardTypes = [
                { title: "Extra Step", desc: "Move 1 extra space." },
                { title: "Shortcut", desc: "Jump to the next fork." },
                { title: "Go Back", desc: "Send an opponent back 2 spaces." },
                { title: "Shield", desc: "Block a negative effect." },
                { title: "Double Roll", desc: "Roll two dice next turn." }
            ];
            for (let i = 0; i < 20; i++) {
                deck.push(cardTypes[i % cardTypes.length]);
            }
            deck.sort(() => Math.random() - 0.5);

            drawPile3D = new THREE.Group();
            discardPile3D = new THREE.Group();
            drawPile3D.position.set(-8, 0.1, 8);
            discardPile3D.position.set(8, 0.1, 8);
            scene.add(drawPile3D, discardPile3D);
            
            const outlineGeo = new THREE.BoxGeometry(2.5, 0.1, 3.5);
            const drawOutlineMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true });
            const discardOutlineMat = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true });
            const drawOutline = new THREE.Mesh(outlineGeo, drawOutlineMat);
            const discardOutline = new THREE.Mesh(outlineGeo, discardOutlineMat);
            drawOutline.position.copy(drawPile3D.position);
            discardOutline.position.copy(discardPile3D.position);
            scene.add(drawOutline, discardOutline);

            for(let i=0; i<4; i++) {
                drawCard(i);
                drawCard(i);
            }
            update3DCardPiles();
            updateHandUI();
        }

        function update3DCardPiles() {
            drawPile3D.children.forEach(c => drawPile3D.remove(c));
            discardPile3D.children.forEach(c => discardPile3D.remove(c));

            const cardGeo = new THREE.BoxGeometry(2.2, 0.05, 3.2);
            const cardMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

            for (let i = 0; i < deck.length; i++) {
                const cardMesh = new THREE.Mesh(cardGeo, cardMat);
                cardMesh.position.y = i * 0.06;
                drawPile3D.add(cardMesh);
            }
            for (let i = 0; i < discardPile.length; i++) {
                const cardMesh = new THREE.Mesh(cardGeo, cardMat);
                cardMesh.position.y = i * 0.06;
                discardPile3D.add(cardMesh);
            }
        }

        function drawCard(playerIndex) {
            if (deck.length === 0) {
                deck = [...discardPile];
                discardPile = [];
                deck.sort(() => Math.random() - 0.5);
            }
            const card = deck.pop();
            if (card) {
                playerHands[playerIndex].push(card);
            }
            update3DCardPiles();
            updateHandUI();
        }

        function discardCard(playerIndex, cardIndex) {
            if (playerHands[playerIndex][cardIndex]) {
                const [card] = playerHands[playerIndex].splice(cardIndex, 1);
                discardPile.push(card);
                update3DCardPiles();
                updateHandUI();
            }
        }
        
        function updateHandUI() {
            const handContainer = document.getElementById('playerHand');
            handContainer.innerHTML = '';
            playerHands[activePlayerIndex].forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `<div class="card-title">${card.title}</div><div class="card-desc">${card.desc}</div>`;
                cardEl.onclick = () => playCard(activePlayerIndex, index);
                handContainer.appendChild(cardEl);
            });
        }

        function playCard(playerIndex, cardIndex) {
            const card = playerHands[playerIndex][cardIndex];
            if (!card) return;
            playerHands[playerIndex].splice(cardIndex, 1);
            discardPile.push(card);
            update3DCardPiles();
            updateHandUI();
            document.getElementById('message').innerText = `Player ${playerIndex + 1} played ${card.title}!`;
            if (card.title === 'Extra Step') {
                turnActionQueue.push(() => playExtraStep(players[playerIndex], processTurnQueue));
            } else if (card.title === 'Go Back') {
                const target = players.find(p => p.id !== playerIndex);
                if (target) {
                    turnActionQueue.push(() => movePlayerBack(target, 2, processTurnQueue));
                }
            }
            processTurnQueue();
        }

        function playExtraStep(player, onComplete) {
            const current = boardSpaces[player.positionIndex];
            if (current.next.length === 0) { onComplete(); return; }
            player.previousPositionIndex = player.positionIndex;
            player.positionIndex = current.next[0];
            animateMove(player, onComplete);
        }

        function handleSpaceAction(player, done) {
             // This was a stub, keeping it as a stub for now
            done(); 
        }

        function createClouds() { // This was the duplicated function, keeping one
            const cloudGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            for (let i = 0; i < 3; i++) {
                const cloud = new THREE.Group();
                const puff1 = new THREE.Mesh(cloudGeo, cloudMat);
                const puff2 = new THREE.Mesh(cloudGeo, cloudMat);
                const puff3 = new THREE.Mesh(cloudGeo, cloudMat);
                puff2.position.set(1.5, 0, 0);
                puff3.position.set(-1.5, 0, 0.5);
                cloud.add(puff1, puff2, puff3);
                cloud.position.set(Math.random() * 40 - 20, 25 + Math.random() * 5, Math.random() * 40 - 20);
                scene.add(cloud);
            }
        }

        function createBoard(){
            const spaceSize = 2, spaceGap = 0.5, totalSize = spaceSize + spaceGap, zOffset = -8, startPlatformOffset = -4;
            const pathData = [
                {pos:{x:0,z:0},next:[1]},{pos:{x:1,z:0},next:[2]},{pos:{x:2,z:0},next:[3]},{pos:{x:3,z:0},next:[4],type:'draw'},
                {pos:{x:4,z:0},next:[5]},{pos:{x:5,z:0},next:[6]},{pos:{x:5,z:1},next:[7]},{pos:{x:5,z:2},next:[8],type:'discard'},
                {pos:{x:4,z:2},next:[9]},{pos:{x:3,z:2},next:[10]},{pos:{x:2,z:2},next:[11]},{pos:{x:1,z:2},next:[12]},
                {pos:{x:0,z:2},next:[13],type:'draw'},{pos:{x:-1,z:2},next:[14]},{pos:{x:-1,z:3},next:[15]},{pos:{x:-1,z:4},next:[16]},
                {pos:{x:0,z:4},next:[17]},{pos:{x:1,z:4},next:[18],type:'discard'},{pos:{x:2,z:4},next:[19]},{pos:{x:3,z:4},next:[20]},
                {pos:{x:4,z:4},next:[21]},{pos:{x:5,z:4},next:[22]},{pos:{x:6,z:4},next:[23],type:'draw'},{pos:{x:7,z:4},next:[24]},
                {pos:{x:8,z:4},next:[25]},{pos:{x:8,z:3},next:[26]},{pos:{x:8,z:2},next:[27]},{pos:{x:8,z:1},next:[28]},
                {pos:{x:8,z:0},next:[29],type:'discard'},{pos:{x:9,z:0},next:[30]},{pos:{x:10,z:0},next:[]}
            ];
            
            pathData.forEach((data, index) => {
                const isStart = index === 0;
                const currentSpaceSize = isStart ? 5 : spaceSize;
                
                const spaceGeometry = new THREE.BoxGeometry(currentSpaceSize, 0.2, currentSpaceSize);
                const spaceMaterial = isStart 
                    ? new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })
                    : new THREE.MeshStandardMaterial({ color: (index % 2 === 0) ? 0xffffff : 0xaaaaaa });

                if (data.next.length === 0) spaceMaterial.color.setHex(0xffff00);
                
                const space = new THREE.Mesh(spaceGeometry, spaceMaterial);
                const yPos = isStart ? 2.0 : 0.1;
                const zPos = (data.pos.z * totalSize) + zOffset + (isStart ? startPlatformOffset : 0);
                const position = new THREE.Vector3(data.pos.x * totalSize, yPos, zPos);
                
                space.position.copy(position);
                space.castShadow = true;
                space.receiveShadow = true;
                scene.add(space);
                boardSpaces.push({ mesh: space, position: position, next: data.next, previous: [], type: data.type });

                if (data.type) {
                    const iconGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
                    const iconMat = new THREE.MeshStandardMaterial({ color: data.type === 'draw' ? 0x3b82f6 : 0xef4444 });
                    const icon = new THREE.Mesh(iconGeo, iconMat);
                    icon.position.set(position.x, position.y + 0.2, position.z);
                    scene.add(icon);
                }
            });

            boardSpaces.forEach((space, index) => {
                space.next.forEach(nextIndex => {
                    if (boardSpaces[nextIndex]) {
                        boardSpaces[nextIndex].previous.push(index);
                    }
                });
            });
        }

        function createPlayers(selectedIndex){ // Kept the more complex version
            const loader = new THREE.GLTFLoader();
            const playerModels = [
                'players/jonah.glb',
                'players/kyle.glb',
                'players/rochelle.glb',
                'players/vickie.glb'
            ];
            const startPosition = boardSpaces[0].position;

            playerModels.forEach((model, i) => {
                loader.load(model, (gltf) => {
                    const mesh = gltf.scene;
                    mesh.scale.set(PLAYER_SCALE, PLAYER_SCALE, PLAYER_SCALE);
                    mesh.traverse(node => { if (node.isMesh) node.castShadow = true; });

                    const offsetX = (i % 2 === 0 ? -PLAYER_START_OFFSET : PLAYER_START_OFFSET);
                    const offsetZ = (i < 2 ? -PLAYER_START_OFFSET : PLAYER_START_OFFSET);
                    mesh.position.set(startPosition.x + offsetX, startPosition.y + PLAYER_Y_OFFSET, startPosition.z + offsetZ);
                    scene.add(mesh);
                    players.push({ mesh: mesh, positionIndex: 0, previousPositionIndex: 0, id: i });

                    if (i === selectedIndex) {
                        activePlayerIndex = i;
                        updateBoardView();
                        camera.position.copy(gameViews.board.cameraPos);
                        controls.target.copy(gameViews.board.controlsTarget);
                    }
                    playersLoaded++;
                    if(playersLoaded === playerModels.length) startIntro();
                }, undefined, (error) => {
                    console.error(`An error happened loading model: ${model}`, error);
                });
            });
        }

        function createEnvironment(){
            // Trees
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
            for(let i=0;i<20;i++){
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,1,8), trunkMat);
                trunk.position.y = 0.5;
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.6,1.5,8), leafMat);
                leaves.position.y = 1.25;
                tree.add(trunk); tree.add(leaves);
                tree.position.set((Math.random()-0.5)*40,0,(Math.random()-0.5)*40);
                tree.castShadow = true;
                scene.add(tree);
            }

            // Shrubs
            const bushMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
            for(let i=0;i<30;i++){
                const bush = new THREE.Mesh(new THREE.SphereGeometry(0.4,8,8), bushMat);
                bush.position.set((Math.random()-0.5)*40,0.2,(Math.random()-0.5)*40);
                bush.castShadow = true;
                scene.add(bush);
            }

            // Clouds
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            for(let i=0;i<10;i++){
                const cloud = new THREE.Group();
                for(let j=0;j<3;j++){
                    const puff = new THREE.Mesh(new THREE.SphereGeometry(1.5,12,12), cloudMat);
                    puff.position.set(j*1.2,0,Math.random()*0.5);
                    cloud.add(puff);
                }
                cloud.position.set((Math.random()-0.5)*50,15+Math.random()*5,(Math.random()-0.5)*50);
                scene.add(cloud);
            }

            // Stars
            for(let i=0;i<100;i++){
                const star = new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
                star.position.set((Math.random()-0.5)*200,30+Math.random()*70,(Math.random()-0.5)*200);
                star.userData.phase = Math.random()*Math.PI*2;
                stars.push(star);
                scene.add(star);
            }

            // Sun and Moon
            sun = new THREE.Mesh(new THREE.SphereGeometry(2,16,16), new THREE.MeshBasicMaterial({ color: 0xffdd00 }));
            moon = new THREE.Mesh(new THREE.SphereGeometry(1.5,16,16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            scene.add(sun);
            scene.add(moon);
        }

        function createDiceMaterials(){
            const size = 128;
            const drawFace = (spots) => {
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0,0,size,size);
                ctx.fillStyle = '#000000';
                const r = size * 0.08;
                const pos = {
                    tl:[size*0.25,size*0.25], tc:[size*0.5,size*0.25], tr:[size*0.75,size*0.25],
                    ml:[size*0.25,size*0.5],  mc:[size*0.5,size*0.5],  mr:[size*0.75,size*0.5],
                    bl:[size*0.25,size*0.75], bc:[size*0.5,size*0.75], br:[size*0.75,size*0.75]
                };
                spots.forEach(key => {
                    const [x,y] = pos[key];
                    ctx.beginPath();
                    ctx.arc(x,y,r,0,Math.PI*2);
                    ctx.fill();
                });
                return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas) });
            };
            const faces = {
                1:['mc'],
                2:['tl','br'],
                3:['tl','mc','br'],
                4:['tl','tr','bl','br'],
                5:['tl','tr','mc','bl','br'],
                6:['tl','ml','bl','tr','mr','br']
            };
            return [
                drawFace(faces[1]),
                drawFace(faces[6]),
                drawFace(faces[2]),
                drawFace(faces[5]),
                drawFace(faces[3]),
                drawFace(faces[4])
            ];
        }

        function initPhysics(){ // Kept the non-minified version
            world = new CANNON.World();
            world.gravity.set(0, -9.82 * 2, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;
            
            for (let i = 0; i < 2; i++) {
                const diceBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)) });
                const materials = createDiceMaterials();
                const threeMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), materials);
                threeMesh.castShadow = true;
                world.addBody(diceBody);
                scene.add(threeMesh);
                dice.push({ body: diceBody, mesh: threeMesh });
            }
            
            const trayPosition = new THREE.Vector3(0, 10, 0); // Matches the 'diceTray' view target
            const traySize = 10, wallHeight = 2, wallThickness = 0.5;
            const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            floorBody.position.copy(trayPosition);
            world.addBody(floorBody);
            
            const woodTexture = new THREE.TextureLoader().load('assets/wood_texture.png');
            const trayMaterial = new THREE.MeshStandardMaterial({ map: woodTexture });

            const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(traySize, wallThickness, traySize), trayMaterial);
            floorMesh.position.set(trayPosition.x, trayPosition.y - wallThickness / 2, trayPosition.z);
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);
            
            [{ p: [0, wallHeight/2, -traySize/2], s: [traySize, wallHeight, wallThickness] },{ p: [0, wallHeight/2, traySize/2], s: [traySize, wallHeight, wallThickness] },{ p: [-traySize/2, wallHeight/2, 0], s: [wallThickness, wallHeight, traySize] },{ p: [traySize/2, wallHeight/2, 0], s: [wallThickness, wallHeight, traySize] }].forEach(d => {
                const wallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(d.s[0]/2, d.s[1]/2, d.s[2]/2)) });
                wallBody.position.set(trayPosition.x + d.p[0], trayPosition.y + d.p[1], trayPosition.z + d.p[2]);
                world.addBody(wallBody);
                const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(...d.s), trayMaterial);
                wallMesh.position.copy(wallBody.position);
                wallMesh.castShadow = true;
                scene.add(wallMesh);
            });
        }

        function startDiceRoll(){ // Kept the non-minified version
            if (Tone.context.state !== 'running') {
                Tone.context.resume();
            }
            noteCounter = 0;
            document.getElementById("diceButton").disabled=true;
            document.getElementById("ui").style.opacity="0";
            switchCameraView("diceTray",()=>{
                isRollInProgress=true;
                timeSinceRest=0;
                const trayPos = gameViews.diceTray.controlsTarget; // Use view target
                dice.forEach((e,t)=>{
                    e.body.position.set(trayPos.x + 2*t-1, trayPos.y + 5, trayPos.z + 2*(Math.random()-.5));
                    e.body.velocity.set(4*(Math.random()-.5),2+4*Math.random(),4*(Math.random()-.5));
                    e.body.angularVelocity.set(20*(Math.random()-.5),20*(Math.random()-.5),20*(Math.random()-.5));
                });
            });
        }
        
        function finishDiceRoll(e){ // Kept the non-minified version
            isRollInProgress=!1;
            const t=e[0]+e[1];
            document.getElementById("message").innerText=`Player ${activePlayerIndex+1} rolled ${e[0]} + ${e[1]} = ${t}!`;
            switchCameraView("board",()=>{
                turnActionQueue.push(()=>movePlayer(t)),processTurnQueue()
            });
        }
        
        function checkDiceSettled(e){ // Kept the non-minified version
            if(!isRollInProgress)return;
            let t=!0;
            const o=.2;
            dice.forEach(e=>{
                e.body.velocity.lengthSquared()>o||e.body.angularVelocity.lengthSquared()>o?t=!1:!0
            });
            t?timeSinceRest+=e:timeSinceRest=0;
            
            if(timeSinceRest > 0.5) {
                let e=!1;
                const trayFloorY = gameViews.diceTray.controlsTarget.y;
                const t = dice.map(t => {
                    if (t.body.position.y < trayFloorY - 1) { // Check if it fell through
                         e=!0
                    }
                    return getDiceResult(t.body)
                });
                
                if(e) {
                    (document.getElementById("message").innerText="Whoops! Fell off. Roll again!",
                    switchCameraView("board",()=>{
                        document.getElementById("ui").style.opacity="1",
                        document.getElementById("diceButton").disabled=!1
                    }),
                    isRollInProgress=!1)
                } else {
                    finishDiceRoll(t)
                }
            }
        }
        
        function getDiceResult(e){ // Kept the non-minified version
            const t=new CANNON.Vec3(0,1,0);
            let o=-1,a=-1;
            return [{v:new CANNON.Vec3(0,0,1),r:1},{v:new CANNON.Vec3(0,0,-1),r:6},{v:new CANNON.Vec3(0,1,0),r:2},{v:new CANNON.Vec3(0,-1,0),r:5},{v:new CANNON.Vec3(1,0,0),r:3},{v:new CANNON.Vec3(-1,0,0),r:4}].forEach(r=>{const d=e.quaternion.vmult(r.v),i=d.dot(t);i>o&&(o=i,a=r.r)}),a
        }
        
        function startIntro(){
            isCameraTransition = true;
            let idx = 0;
            function showNext(){
                if(idx >= players.length){
                    isCameraTransition = false;
                    startTurnForActivePlayer();
                    return;
                }
                const p = players[idx];
                const camPos = p.mesh.position.clone().add(new THREE.Vector3(2,4,2));
                new TWEEN.Tween(camera.position).to(camPos,1000).easing(TWEEN.Easing.Quadratic.InOut).onComplete(()=>{
                    idx++;
                    showNext();
                }).start();
                new TWEEN.Tween(controls.target).to(p.mesh.position,1000).easing(TWEEN.Easing.Quadratic.InOut).start();
            }
            showNext();
        }

        function highlightActivePlayer(player, done){
            isCameraTransition = true;
            const originalScale = player.mesh.scale.clone();
            const targetScale = originalScale.clone().multiplyScalar(PLAYER_PULSE_SCALE);
            const camPos = player.mesh.position.clone().add(new THREE.Vector3(2,4,2));
            new TWEEN.Tween(camera.position).to(camPos,1000).easing(TWEEN.Easing.Quadratic.InOut).start();
            new TWEEN.Tween(controls.target).to(player.mesh.position,1000).easing(TWEEN.Easing.Quadratic.InOut).onComplete(()=>{
                const pulseUp = new TWEEN.Tween(player.mesh.scale).to({x:targetScale.x,y:targetScale.y,z:targetScale.z},400).easing(TWEEN.Easing.Quadratic.Out);
                const pulseDown = new TWEEN.Tween(player.mesh.scale).to({x:originalScale.x,y:originalScale.y,z:originalScale.z},400).easing(TWEEN.Easing.Quadratic.In);
                pulseUp.chain(pulseDown);
                pulseDown.onComplete(()=>{
                    updateBoardView();
                    new TWEEN.Tween(camera.position).to(gameViews.board.cameraPos,800).easing(TWEEN.Easing.Quadratic.InOut).onComplete(()=>{
                        isCameraTransition = false;
                        if(done) done();
                    }).start();
                    new TWEEN.Tween(controls.target).to(gameViews.board.controlsTarget,800).easing(TWEEN.Easing.Quadratic.InOut).start();
                });
                pulseUp.start();
            }).start();
        }

        function startTurnForActivePlayer(){
            const player = players[activePlayerIndex];
            document.getElementById("message").innerText = `Player ${activePlayerIndex+1}'s Turn!`;
            highlightActivePlayer(player, () => {
                document.getElementById("ui").style.opacity = "1";
                document.getElementById("diceButton").disabled = false;
                updateHandUI();
                processTurnQueue();
                setTimeout(()=>{ if(!isRollInProgress) startDiceRoll(); },1000);
            });
        }

        function nextTurn(){ // Kept the non-minified version
            activePlayerIndex = (activePlayerIndex + 1) % players.length;
            startTurnForActivePlayer();
        }

        function checkForFaceOff(e,t){const o=e.positionIndex,a=players.find(t=>t.id!==e.id&&t.positionIndex===o);a?startFaceOff(e,a):t()}
        
        function startFaceOff(e,t){const o=document.getElementById("minigameFaceoff");document.getElementById("faceoffPlayers").innerText=`Player ${e.id+1} vs Player ${t.id+1}`,o.style.display="flex",document.getElementById("startFaceoffBtn").onclick=()=>{o.style.display="none",resolveFaceOff(e,t)}}
        
        function resolveFaceOff(e,t){const o=.5>Math.random()?e:t,a=o===e?t:e;document.getElementById("message").innerText=`Player ${o.id+1} wins the face-off!`,movePlayerBack(a,3,()=>{processTurnQueue()})}
        
        function movePlayerBack(e,t,o){let a=0;!function r(){a>=t||0===e.positionIndex?o():void 0!==(d=boardSpaces[e.positionIndex].previous[0])?(e.previousPositionIndex=e.positionIndex,e.positionIndex=d,animateMove(e,r)):o();var d;a++}()}
        
        function processTurnQueue(){if(turnActionQueue.length>0){(0,turnActionQueue.shift())()}}
        
        function movePlayer(e){let t=0;const o=players[activePlayerIndex];!function a(){t>=e?turnActionQueue.push(()=>checkForFaceOff(o,()=>{turnActionQueue.push(()=>handleSpaceAction(o,()=>{turnActionQueue.push(nextTurn),processTurnQueue()})),processTurnQueue()})):(()=>{const e=boardSpaces[o.positionIndex];if(0===e.next.length)return document.getElementById("message").innerText=`Player ${o.id+1} finished!`,turnActionQueue.push(nextTurn),void processTurnQueue();o.previousPositionIndex=o.positionIndex,o.positionIndex=e.next[0],animateMove(o,a)})(),t++}()}

        function animateMove(player, callback){ // Kept the non-minified version
            const targetPos = boardSpaces[player.positionIndex].position;
            const pid = player.id;
            const xOffset = PLAYER_MOVE_OFFSET * (pid % 2 === 0 ? -1 : 1);
            const zOffset = PLAYER_MOVE_OFFSET * (pid < 2 ? -1 : 1);
            const y = targetPos.y + PLAYER_Y_OFFSET;
            const dest = new THREE.Vector3(targetPos.x + xOffset, y, targetPos.z + zOffset);

            const highlight = () => {
                const space = boardSpaces[player.positionIndex].mesh;
                const prevColor = space.material.emissive.getHex();
                space.material.emissive.setHex(0xffff00);
                const note = musicalScale[noteCounter % musicalScale.length];
                synth.triggerAttackRelease(note, "8n");
                noteCounter++;
                setTimeout(() => { space.material.emissive.setHex(prevColor); }, 400);
                if (callback) callback();
            };

            const startPos = player.mesh.position.clone();
            const targetRotY = Math.atan2(dest.x - startPos.x, dest.z - startPos.z);
            new TWEEN.Tween(player.mesh.rotation).to({ y: targetRotY }, 200).easing(TWEEN.Easing.Quadratic.Out).start();
            new TWEEN.Tween(player.mesh.rotation).to({ z: 0.3 }, 100).yoyo(true).repeat(4).start();

            if (player.previousPositionIndex === 0) {
                const peak = startPos.clone().lerp(dest, 0.5);
                peak.y += 3;
                const upTween = new TWEEN.Tween(player.mesh.position).to(peak, 300).easing(TWEEN.Easing.Quadratic.Out);
                const downTween = new TWEEN.Tween(player.mesh.position).to(dest, 300).easing(TWEEN.Easing.Quadratic.In);
                upTween.chain(downTween);
                downTween.onComplete(highlight);
                upTween.start();
            } else {
                new TWEEN.Tween(player.mesh.position).to(dest, 400).easing(TWEEN.Easing.Quadratic.Out).onComplete(highlight).start();
            }
        }
        
        function updateBoardView(){
            if(players[activePlayerIndex]){
                const pos=players[activePlayerIndex].mesh.position;
                gameViews.board.cameraPos.set(pos.x+5,pos.y+8,pos.z+5);
                gameViews.board.controlsTarget.copy(pos);
            }
        }

        function switchCameraView(e,t){ // Kept the non-minified version
            currentView=e;
            if(e==="board")updateBoardView();
            const o=gameViews[e];
            isCameraTransition=true;
            new TWEEN.Tween(camera.position).to(o.cameraPos,1e3).easing(TWEEN.Easing.Quadratic.InOut).onComplete(()=>{isCameraTransition=false,t&&t();}).start();
            new TWEEN.Tween(controls.target).to(o.controlsTarget,1e3).easing(TWEEN.Easing.Quadratic.InOut).start()
        }
        
        function followPlayer(){
            if(currentView==='board'&&!isCameraTransition&&players[activePlayerIndex]){
                const pos=players[activePlayerIndex].mesh.position;
                const desired=pos.clone().add(new THREE.Vector3(5,8,5));
                camera.position.lerp(desired,0.1);
                controls.target.lerp(pos,0.1);
            }
        }

        function idleCamera(delta){
            if(currentView==='board'&&!isCameraTransition&&!isRollInProgress&&turnActionQueue.length===0){
                const center = controls.target;
                const offset = camera.position.clone().sub(center);
                offset.applyAxisAngle(new THREE.Vector3(0,1,0), delta*0.1);
                camera.position.copy(center.clone().add(offset));
            }
        }

        function updateEnvironment(delta){
            timeOfDay = (timeOfDay + delta/60) % 24; // 1 minute real = 1 hour game
            const angle = (timeOfDay/24) * Math.PI * 2;
            const radius = 50;
            sun.position.set(Math.sin(angle)*radius, Math.cos(angle)*radius, 0);
            moon.position.set(Math.sin(angle+Math.PI)*radius, Math.cos(angle+Math.PI)*radius, 0);
            directionalLight.position.copy(sun.position);
            const dayFactor = Math.max(0, Math.cos(angle));
            directionalLight.intensity = 1.5 * dayFactor;
            ambientLight.intensity = 0.3 + 0.7 * dayFactor;
            const dayColor = new THREE.Color(0x87ceeb);
            const nightColor = new THREE.Color(0x000022);
            const skyColor = dayColor.clone().lerp(nightColor,1-dayFactor);
            scene.background = skyColor;
            scene.fog.color.copy(skyColor);
            stars.forEach(s=>{ s.material.opacity = 0.5 + 0.5*Math.sin(clock.elapsedTime*2 + s.userData.phase); });
        }

        const clock = new THREE.Clock();
        function animate(){
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            world.step(1/60,delta,3);
            dice.forEach(d=>{
                d.mesh.position.copy(d.body.position);
                d.mesh.quaternion.copy(d.body.quaternion);
            });
            checkDiceSettled(delta);
            controls.update();
            TWEEN.update();
            followPlayer();
            idleCamera(delta);
            updateEnvironment(delta);
            renderer.render(scene,camera);
            if(minimapRenderer&&minimapCamera){
                minimapRenderer.render(scene,minimapCamera);
            }
        }
        
        function onWindowResize(){camera.aspect=window.innerWidth/window.innerHeight,camera.updateProjectionMatrix(),renderer.setSize(window.innerWidth,window.innerHeight)}
        
        document.querySelectorAll('.player-select-btn').forEach(btn=>{
            btn.addEventListener('click',()=>{
                const index=parseInt(btn.getAttribute('data-player'));
                document.getElementById('playerSelect').style.display='none';
                init(index);
            });
        });
    </script>
</body>
</html>
