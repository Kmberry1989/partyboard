<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Partyverse - V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #000;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* UI Components */
        .overlay-panel {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            color: white;
        }

        .btn {
            background: linear-gradient(45deg, #3b82f6, #2563eb);
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-weight: 800;
            font-size: 1.25rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        #ui {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            z-index: 10;
            pointer-events: none;
            /* Let clicks pass through to 3D */
            width: 100%;
        }

        #ui>* {
            pointer-events: auto;
        }

        #message {
            font-size: 2rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 0.5rem 2rem;
            border-radius: 1rem;
            backdrop-filter: blur(4px);
        }

        #playerStats {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 10;
        }

        .stat-line {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            color: white;
            font-family: monospace;
            font-size: 1.1rem;
            border-left: 4px solid transparent;
        }

        .stat-line.player-0 {
            border-color: #f87171;
        }

        .stat-line.player-1 {
            border-color: #60a5fa;
        }

        .stat-line.player-2 {
            border-color: #facc15;
        }

        .stat-line.player-3 {
            border-color: #4ade80;
        }

        .stat-icon {
            width: 20px;
            height: 20px;
            margin: 0 0.5rem;
        }

        #playerHand {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.5rem;
            z-index: 20;
        }

        .card {
            width: 100px;
            height: 140px;
            background: white;
            border-radius: 0.5rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            font-size: 0.8rem;
            color: black;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 2px solid #333;
        }

        .card:hover {
            transform: translateY(-20px) scale(1.1);
            z-index: 30;
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 2px;
        }

        .card-desc {
            font-size: 0.75rem;
            color: #555;
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Player Select Specifics */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin-top: 2rem;
        }

        .player-select-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
            cursor: pointer;
        }

        .player-select-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
            transform: scale(1.05);
        }

        .player-avatar {
            width: 100px;
            height: 100px;
            background: #333;
            border-radius: 50%;
            margin-bottom: 1rem;
            display: grid;
            place-items: center;
            font-size: 2rem;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- ... existing links ... -->
</head>

<body>
    <div id="container">
        <div id="playerSelect" class="overlay-panel" style="display:flex;">
            <h1 class="text-4xl font-bold mb-4">Welcome to PartyVerse</h1>
            <p class="text-xl mb-8">Choose your character to begin:</p>
            <div class="player-grid">
                <div class="player-select-btn" data-player="0">
                    <div class="player-avatar" style="background: #f87171;">J</div>
                    <span class="text-xl font-bold">Jonah</span>
                </div>
                <div class="player-select-btn" data-player="1">
                    <div class="player-avatar" style="background: #60a5fa;">K</div>
                    <span class="text-xl font-bold">Kyle</span>
                </div>
                <div class="player-select-btn" data-player="2">
                    <div class="player-avatar" style="background: #facc15; color: black;">R</div>
                    <span class="text-xl font-bold">Rochelle</span>
                </div>
                <div class="player-select-btn" data-player="3">
                    <div class="player-avatar" style="background: #4ade80; color: black;">V</div>
                    <span class="text-xl font-bold">Vickie</span>
                </div>
            </div>
            <p class="mt-8 text-gray-400 text-sm">Use Mouse to Rotate • Scroll to Zoom</p>
        </div>

        <!-- Main Game UI -->
        <div id="ui">
            <div id="message">Player 1's Turn!</div>
        </div>

        <!-- Player Coin/Star Stats -->
        <div id="playerStats">
            <div id="roundCounter" class="stat-line" style="color: white; font-size: 1.25rem; margin-bottom: 0.5rem;">
                Round 1 / 10</div>
            <!-- Player stats will be populated by JS -->
        </div>

        <!-- Player Card Hand -->
        <div id="playerHand"></div>

        <!-- Card Piles Labels (Visual) -->
        <div id="cardPiles"
            style="position: absolute; bottom: 10px; right: 10px; color: white; opacity: 0.5; font-size: 0.8rem; pointer-events: none;">
            <!-- 3D Piles are managed by Three.js -->
        </div>

        <!-- Face-off Panel -->
        <div id="minigameFaceoff" class="overlay-panel" style="display:none;">
            <div id="faceoffMessage" class="text-white text-xl font-bold mb-2">FACE-OFF!</div>
            <div id="faceoffPlayers" class="text-white text-md mb-4"></div>
            <button id="startFaceoffBtn" class="btn faceoffBtn">Start Challenge!</button>
        </div>

        <!-- Discard Choice Panel -->
        <div id="discardChoice" class="overlay-panel" style="display:none;">
            <h2 class="text-3xl font-bold mb-4">Hand Full!</h2>
            <p class="mb-4">Select a card to discard:</p>
            <div id="discardList" class="flex gap-4"></div>
        </div>

        <!-- Minigame Wheel Panel -->
        <div id="minigameWheelPanel" class="overlay-panel" style="display:none;">
            <h2 class="text-4xl font-bold mb-8 text-white">Minigame Roulette!</h2>
            <div class="wheel-container" style="position: relative; width: 300px; height: 300px; margin-bottom: 2rem;">
                <div id="wheel" style="width: 100%; height: 100%; border-radius: 50%; border: 4px solid white; transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1); background: conic-gradient(
                    #ff7f50 0deg 60deg, 
                    #4ade80 60deg 120deg, 
                    #60a5fa 120deg 180deg, 
                    #facc15 180deg 240deg, 
                    #a855f7 240deg 300deg, 
                    #f472b6 300deg 360deg
                );"></div>
                <div id="pointer"
                    style="position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid white; z-index: 10;">
                </div>
            </div>
            <div id="wheelResult" class="text-3xl font-bold text-white mb-4" style="opacity: 0;"></div>
            <button id="spinWheelBtn" class="btn">SPIN!</button>
        </div>

        <!-- Coin Flip Result Panel -->
        <div id="coinFlipResult" class="overlay-panel" style="display:none;">
            <div id="coinFlipResultMessage" class="text-white text-6xl font-bold mb-8">HEADS!</div>
            <button id="coinFlipContinueBtn" class="btn">Continue</button>
        </div>

        <!-- Rankings Panel -->
        <div id="rankingsPanel" class="overlay-panel" style="display:none;">
            <h1 class="text-6xl font-black text-white mb-8 italic"
                style="-webkit-text-stroke: 2px black; text-shadow: 0 0 20px rgba(255,255,255,0.5);">FINAL STANDINGS
            </h1>
            <div id="rankingsList" class="flex flex-col gap-4 w-full max-w-2xl px-8">
                <!-- Populated via JS -->
            </div>
            <button id="restartGameBtn" class="btn mt-8" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@18.6.4/dist/tween.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

    <script>
        // === SCENE & PHYSICS SETUP ===
        let scene, camera, renderer, controls, world;
        const container = document.getElementById('container');
        let dice = [];
        let coinMesh, coinBody; // NEW: For coin flip
        let isRollInProgress = false;
        let isCoinFlipInProgress = false; // NEW: Flag for coin flip
        let timeSinceRest = 0;
        let ambientLight, directionalLight, sun, moon, minimapRenderer, minimapCamera;
        const stars = [];
        let timeOfDay = 0;

        // === GAME STATE ===
        const boardSpaces = [];
        const players = [];
        const PLAYER_Y_OFFSET = 0.1;
        const PLAYER_SCALE = 1.5;
        const PLAYER_START_OFFSET = 0.6 * (PLAYER_SCALE / 0.5);
        const PLAYER_PULSE_SCALE = 1.3;
        let playersLoaded = 0;
        let activePlayerIndex = 0;
        const diceTrayPos = new THREE.Vector3(0, 10, -15);
        const gameViews = {
            board: { cameraPos: new THREE.Vector3(0, 18, 14), controlsTarget: new THREE.Vector3(0, 0, 0) },
            diceTray: { cameraPos: new THREE.Vector3(100, 25, 108), controlsTarget: new THREE.Vector3(100, 10, 100) }
        };
        let currentView = 'board';
        let isCameraTransition = false;
        let turnActionQueue = [];
        let faceOffChallenger, faceOffOpponent; // NEW: Store face-off participants

        // === NEW MARIO PARTY GAME STATE ===
        let playerCoins = [0, 0, 0, 0];
        let playerStars = [0, 0, 0, 0];
        let currentRound = 1;
        let maxRounds = 10;
        let starPrice = 20;
        let starSpaceIndex = -1;
        let starObject = null;

        // === CARD GAME STATE ===
        let deck = [];
        let discardPile = [];
        let playerHands = [[], [], [], []];
        let drawPile3D, discardPile3D;

        // === AUDIO STATE ===
        let synth;
        const musicalScale = ['C4', 'D4', 'E4', 'G4', 'A4', 'C5'];
        let noteCounter = 0;
        const playerColors = ['#f87171', '#60a5fa', '#facc15', '#4ade80']; // For UI

        function init(selectedIndex) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 20, 50); // Stronger draw distance fog
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.copy(gameViews.board.cameraPos);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.copy(gameViews.board.controlsTarget);
            controls.enableDamping = true;

            ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(20, 40, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.top = 30;
            directionalLight.shadow.camera.bottom = -30;
            directionalLight.shadow.camera.left = -30;
            directionalLight.shadow.camera.right = 30;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            const textureLoader = new THREE.TextureLoader();
            const grassTexture = textureLoader.load('assets/grass_texture.png');
            grassTexture.wrapS = THREE.RepeatWrapping;
            grassTexture.wrapT = THREE.RepeatWrapping;
            grassTexture.repeat.set(10, 10);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(60, 60),
                new THREE.MeshLambertMaterial({ map: grassTexture })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            createBoard();
            createStar();
            moveStar();
            createPlayers(selectedIndex);
            playerHands = [[], [], [], []];
            initPhysics();
            initCardGame();

            createEnvironment();

            synth = new Tone.Synth().toDestination();

            window.addEventListener('resize', onWindowResize, false);
            const diceButton = document.createElement('button');
            diceButton.id = 'diceButton';
            diceButton.className = 'btn';
            diceButton.innerText = 'Roll Dice';
            document.getElementById('ui').appendChild(diceButton);
            diceButton.addEventListener('click', startDiceRoll);
            diceButton.disabled = true;
            document.getElementById('ui').style.opacity = "0";

            // Minimap setup
            minimapRenderer = new THREE.WebGLRenderer({ antialias: true });
            minimapRenderer.setSize(200, 200);
            minimapRenderer.domElement.style.position = 'absolute';
            minimapRenderer.domElement.style.right = '1rem';
            minimapRenderer.domElement.style.bottom = '1rem';
            minimapRenderer.domElement.style.border = '2px solid white';
            minimapRenderer.domElement.style.borderRadius = '0.5rem';
            container.appendChild(minimapRenderer.domElement);
            minimapCamera = new THREE.OrthographicCamera(-20, 20, 20, -20, 0.1, 100);
            minimapCamera.position.set(0, 50, 0);
            minimapCamera.lookAt(0, 0, 0);

            updatePlayerStatsUI();

            // Check for saved state from a minigame
            loadGameState();

            animate();
        }

        function saveGameState() {
            const state = {
                players: players.map(p => ({
                    id: p.id,
                    positionIndex: p.positionIndex,
                    // No need to save mesh/physics, just logic data
                })),
                playerCoins: playerCoins,
                playerStars: playerStars,
                currentRound: currentRound,
                maxRounds: maxRounds,
                activePlayerIndex: activePlayerIndex,
                starSpaceIndex: starSpaceIndex
            };
            localStorage.setItem('partyBoardState', JSON.stringify(state));
        }

        function loadGameState() {
            const saved = localStorage.getItem('partyBoardState');
            if (saved) {
                const state = JSON.parse(saved);

                // Restore Globals
                playerCoins = state.playerCoins;
                playerStars = state.playerStars;
                currentRound = state.currentRound;
                activePlayerIndex = state.activePlayerIndex;

                // Restore Players
                state.players.forEach((pData, i) => {
                    if (players[i]) {
                        players[i].positionIndex = pData.positionIndex;
                        // Move physics/mesh to the correct space
                        const space = boardSpaces[pData.positionIndex];
                        if (space) {
                            const pos = space.position;
                            const offsetX = (i % 2 === 0 ? -PLAYER_START_OFFSET : PLAYER_START_OFFSET);
                            const offsetZ = (i < 2 ? -PLAYER_START_OFFSET : PLAYER_START_OFFSET);
                            const target = new THREE.Vector3(pos.x + offsetX, pos.y + PLAYER_Y_OFFSET, pos.z + offsetZ);
                            players[i].mesh.position.copy(target);
                            // Reset animation/physics if needed
                        }
                    }
                });

                // Restore Star
                if (state.starSpaceIndex !== -1) {
                    starSpaceIndex = state.starSpaceIndex;
                    // Visual update
                    if (boardSpaces[starSpaceIndex]) {
                        boardSpaces[starSpaceIndex].type = 'star';
                        const pos = boardSpaces[starSpaceIndex].position;
                        starObject.position.set(pos.x, pos.y + 0.5, pos.z);
                    }
                }

                updatePlayerStatsUI();
                localStorage.removeItem('partyBoardState'); // Clear after loading

                // If returning from minigame, maybe show a "Welcome Back" toast
                document.getElementById('message').innerText = `Welcome back! Round ${currentRound}`;
            }
        }

        // --- (Card Game functions remain the same) ---
        function initCardGame() {
            const cardTypes = [
                { title: "Extra Step", desc: "Move 1 extra space." },
                { title: "Shortcut", desc: "Jump to the next fork." },
                { title: "Go Back", desc: "Send an opponent back 2 spaces." },
                { title: "Shield", desc: "Block a negative effect." },
                { title: "Double Roll", desc: "Roll two dice next turn." },
                { title: "Ace of Spades", desc: "Aces High! Move 11 spaces." },
                { title: "King of Hearts", desc: "Swap with last place player." },
                { title: "Queen of Diamonds", desc: "Gain 15 Coins." },
                { title: "Jack of Clubs", desc: "Steal 5 coins from everyone." }
            ];
            for (let i = 0; i < 20; i++) {
                deck.push(cardTypes[i % cardTypes.length]);
            }
            deck.sort(() => Math.random() - 0.5);

            drawPile3D = new THREE.Group();
            discardPile3D = new THREE.Group();
            drawPile3D.position.set(-8, 0.1, 8);
            discardPile3D.position.set(8, 0.1, 8);
            scene.add(drawPile3D, discardPile3D);

            const outlineGeo = new THREE.BoxGeometry(2.5, 0.1, 3.5);
            const drawOutlineMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true });
            const discardOutlineMat = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true });
            const drawOutline = new THREE.Mesh(outlineGeo, drawOutlineMat);
            const discardOutline = new THREE.Mesh(outlineGeo, discardOutlineMat);
            drawOutline.position.copy(drawPile3D.position);
            discardOutline.position.copy(discardPile3D.position);
            scene.add(drawOutline, discardOutline);

            for (let i = 0; i < 4; i++) {
                drawCard(i);
                drawCard(i);
            }
            update3DCardPiles();
            updateHandUI();
        }
        function update3DCardPiles() {
            drawPile3D.children.forEach(c => drawPile3D.remove(c));
            discardPile3D.children.forEach(c => discardPile3D.remove(c));

            const cardGeo = new THREE.BoxGeometry(2.2, 0.05, 3.2);
            const cardMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

            for (let i = 0; i < deck.length; i++) {
                const cardMesh = new THREE.Mesh(cardGeo, cardMat);
                cardMesh.position.y = i * 0.06;
                drawPile3D.add(cardMesh);
            }
            for (let i = 0; i < discardPile.length; i++) {
                const cardMesh = new THREE.Mesh(cardGeo, cardMat);
                cardMesh.position.y = i * 0.06;
                discardPile3D.add(cardMesh);
            }
        }
        function drawCard(playerIndex) {
            if (playerHands[playerIndex].length >= 5) { // Limit hand size
                return;
            }
            if (deck.length === 0) {
                deck = [...discardPile];
                discardPile = [];
                deck.sort(() => Math.random() - 0.5);
            }
            const card = deck.pop();
            if (card) {
                playerHands[playerIndex].push(card);
            }
            update3DCardPiles();
            if (playerIndex === activePlayerIndex) updateHandUI();
        }
        function discardCard(playerIndex, cardIndex) {
            if (playerHands[playerIndex][cardIndex]) {
                const [card] = playerHands[playerIndex].splice(cardIndex, 1);
                discardPile.push(card);
                update3DCardPiles();
                if (playerIndex === activePlayerIndex) updateHandUI();
            }
        }
        function updateHandUI() {
            const handContainer = document.getElementById('playerHand');
            handContainer.innerHTML = '';
            playerHands[activePlayerIndex].forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `<div class="card-title">${card.title}</div><div class="card-desc">${card.desc}</div>`;
                cardEl.onclick = () => playCard(activePlayerIndex, index);
                handContainer.appendChild(cardEl);
            });
        }
        function playCard(playerIndex, cardIndex) {
            const card = playerHands[playerIndex][cardIndex];
            if (!card) return;
            if (playerIndex !== activePlayerIndex || isRollInProgress || isCoinFlipInProgress) return;

            playerHands[playerIndex].splice(cardIndex, 1);
            discardPile.push(card);
            update3DCardPiles();
            updateHandUI();
            document.getElementById('message').innerText = `Player ${playerIndex + 1} played ${card.title}!`;
            if (card.title === 'Extra Step') {
                turnActionQueue.push(() => playExtraStep(players[playerIndex], processTurnQueue));
            } else if (card.title === 'Go Back') {
                const target = players.find(p => p.id !== playerIndex);
                if (target) {
                    turnActionQueue.push(() => movePlayerBack(target, 2, processTurnQueue));
                }
            } else if (card.title === 'Ace of Spades') {
                // Move 11 spaces (conceptually playExtraStep repeated or custom)
                // Simply advancing positionIndex logic or implementing a specific "move 11"
                // For safety in this complex spaghetti, we simulate updating position index directly then animating move
                turnActionQueue.push(() => {
                    const p = players[playerIndex];
                    let targetIdx = (p.positionIndex + 11) % boardSpaces.length; // Loop simple
                    if (targetIdx === 0) targetIdx = 1; // Don't get stuck at start
                    p.previousPositionIndex = p.positionIndex;
                    p.positionIndex = targetIdx;
                    animateMove(p, processTurnQueue);
                });
            } else if (card.title === 'Queen of Diamonds') {
                playerCoins[playerIndex] += 15;
                updatePlayerStatsUI();
                processTurnQueue();
            } else if (card.title === 'Jack of Clubs') {
                players.forEach((p, i) => {
                    if (i !== playerIndex) {
                        const steal = Math.min(5, playerCoins[i]);
                        playerCoins[i] -= steal;
                        playerCoins[playerIndex] += steal;
                    }
                });
                updatePlayerStatsUI();
                processTurnQueue();
            } else if (card.title === 'King of Hearts') {
                // Find last place (lowest coins? or stars? usually distance)
                // Simplest: Lowest Coins
                let minCoins = 9999;
                let targetId = -1;
                players.forEach((p, i) => {
                    if (i !== playerIndex && playerCoins[i] < minCoins) {
                        minCoins = playerCoins[i];
                        targetId = i;
                    }

        /**
         * Draws a face for dice or coins
         */
        function drawFace(drawCallback) {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');
            drawCallback(ctx, size);
            return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas) });
        }

        /**
         * Returns an array of 6 materials for a die.
         */
        function createDiceFaceMaterials() {
            const drawPips = (spots) => (ctx, size) => {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                ctx.fillStyle = '#000000';
                const r = size * 0.08;
                const pos = {
                    tl: [size * 0.25, size * 0.25], tc: [size * 0.5, size * 0.25], tr: [size * 0.75, size * 0.25],
                    ml: [size * 0.25, size * 0.5], mc: [size * 0.5, size * 0.5], mr: [size * 0.75, size * 0.5],
                    bl: [size * 0.25, size * 0.75], bc: [size * 0.5, size * 0.75], br: [size * 0.75, size * 0.75]
                };
                spots.forEach(key => {
                    const [x, y] = pos[key];
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                });
            };
            const faces = {
                1: ['mc'], 2: ['tl', 'br'], 3: ['tl', 'mc', 'br'],
                4: ['tl', 'tr', 'bl', 'br'], 5: ['tl', 'tr', 'mc', 'bl', 'br'], 6: ['tl', 'ml', 'bl', 'tr', 'mr', 'br']
            };
            return [
                drawFace(drawPips(faces[1])), drawFace(drawPips(faces[6])),
                drawFace(drawPips(faces[2])), drawFace(drawPips(faces[5])),
                drawFace(drawPips(faces[3])), drawFace(drawPips(faces[4]))
            ];
        }

        /**
         * Returns an array of 3 materials for a coin (Heads, Tails, Side).
         */
        function createCoinFaceMaterials() {
            // Heads: A Star
            const headsMat = drawFace((ctx, size) => {
                ctx.fillStyle = '#FFD700'; // Gold
                ctx.fillRect(0, 0, size, size);
                ctx.fillStyle = '#FFA500'; // Orange
                ctx.font = 'bold 100px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('★', size / 2, size / 2 + 10); // Star emoji
            });

            // Tails: A Coin
            const tailsMat = drawFace((ctx, size) => {
                ctx.fillStyle = '#FFD700'; // Gold
                ctx.fillRect(0, 0, size, size);
                ctx.fillStyle = '#FFA500'; // Orange
                ctx.font = 'bold 100px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('C', size / 2, size / 2 + 5); // Coin
            });

            // Side: Just gold
            const sideMat = new THREE.MeshStandardMaterial({ color: 0xFFD700 });

            // THREE.CylinderGeometry materials order: [side, top(heads), bottom(tails)]
            return [sideMat, headsMat, tailsMat];
        }

        function initPhysics() {
            world = new CANNON.World();
            world.gravity.set(0, -9.82 * 2, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;

            // Create Dice
            for (let i = 0; i < 2; i++) {
                const diceBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)) });
                const materials = createDiceFaceMaterials();
                const threeMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), materials);
                threeMesh.castShadow = true;
                world.addBody(diceBody);
                scene.add(threeMesh);
                dice.push({ body: diceBody, mesh: threeMesh });
            }

            // NEW: Create Coin
            const coinRadius = 0.7, coinHeight = 0.1;
            coinBody = new CANNON.Body({
                mass: 0.5,
                shape: new CANNON.Cylinder(coinRadius, coinRadius, coinHeight, 16)
            });
            const coinMaterials = createCoinFaceMaterials();
            coinMesh = new THREE.Mesh(new THREE.CylinderGeometry(coinRadius, coinRadius, coinHeight, 32), coinMaterials);
            coinMesh.castShadow = true;
            coinMesh.visible = false; // Start hidden
            world.addBody(coinBody);
            scene.add(coinMesh);

            // Create Tray
            const trayPosition = new THREE.Vector3(100, 10, 100); // Moved far away
            const traySize = 10, wallHeight = 2, wallThickness = 0.5;
            const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            floorBody.position.copy(trayPosition);
            world.addBody(floorBody);

            const woodTexture = new THREE.TextureLoader().load('assets/wood_texture.png');
            const trayMaterial = new THREE.MeshStandardMaterial({ map: woodTexture });
            const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(traySize, wallThickness, traySize), trayMaterial);
            floorMesh.position.set(trayPosition.x, trayPosition.y - wallThickness / 2, trayPosition.z);
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            [{ p: [0, wallHeight / 2, -traySize / 2], s: [traySize, wallHeight, wallThickness] }, { p: [0, wallHeight / 2, traySize / 2], s: [traySize, wallHeight, wallThickness] }, { p: [-traySize / 2, wallHeight / 2, 0], s: [wallThickness, wallHeight, traySize] }, { p: [traySize / 2, wallHeight / 2, 0], s: [wallThickness, wallHeight, traySize] }].forEach(d => {
                const wallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(d.s[0] / 2, d.s[1] / 2, d.s[2] / 2)) });
                wallBody.position.set(trayPosition.x + d.p[0], trayPosition.y + d.p[1], trayPosition.z + d.p[2]);
                world.addBody(wallBody);
                const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(...d.s), trayMaterial);
                wallMesh.position.copy(wallBody.position);
                wallMesh.castShadow = true;
                scene.add(wallMesh);
            });
        }

        function checkDiceSettled(delta) { // Renamed param e -> delta
            if (!isRollInProgress) return;
            let isSettled = true; // Renamed t -> isSettled
            const threshold = 0.2; // Renamed o -> threshold
            dice.forEach(e => { if (e.body.velocity.lengthSquared() > threshold || e.body.angularVelocity.lengthSquared() > threshold) isSettled = false; });
            isSettled ? timeSinceRest += delta : timeSinceRest = 0; // Fixed e -> delta
            if (timeSinceRest > 0.5) {
                let fellOff = false; // Renamed e -> fellOff
                const trayFloorY = gameViews.diceTray.controlsTarget.y;
                const results = dice.map(t => { // Renamed t -> results
                    if (t.body.position.y < trayFloorY - 2) fellOff = true;
                    return getDiceResult(t.body)
                });
                if (fellOff) {
                    document.getElementById("message").innerText = "Whoops! Fell off. Roll again!";
                    switchCameraView("board", () => {
                        document.getElementById("ui").style.opacity = "1";
                        document.getElementById("diceButton").disabled = false;
                    });
                    isRollInProgress = false;
                } else {
                    finishDiceRoll(results)
                }
            }
        }
        function getDiceResult(e) {
            const t = new CANNON.Vec3(0, 1, 0); let o = -1, a = -1;
            [{ v: new CANNON.Vec3(0, 0, 1), r: 1 }, { v: new CANNON.Vec3(0, 0, -1), r: 6 }, { v: new CANNON.Vec3(0, 1, 0), r: 2 }, { v: new CANNON.Vec3(0, -1, 0), r: 5 }, { v: new CANNON.Vec3(1, 0, 0), r: 3 }, { v: new CANNON.Vec3(-1, 0, 0), r: 4 }].forEach(r => { const d = e.quaternion.vmult(r.v), i = d.dot(t); i > o && (o = i, a = r.r) });
            return a
        }

            document.getElementById("ui").style.opacity = "0";

            // Hide dice, show coin
            dice.forEach(d => d.mesh.visible = false);
            coinMesh.visible = true;
            isRollInProgress = false;

            // Move camera FIRST, then flip
            switchCameraView("diceTray", () => {
                timeSinceRest = 0;
                const trayPos = gameViews.diceTray.controlsTarget;
                coinBody.position.set(trayPos.x, trayPos.y + 3, trayPos.z);
                coinBody.velocity.set(0, 15, 0); // Harder flip
                coinBody.angularVelocity.set(40 * (Math.random() - 0.5), 0, 40 * (Math.random() - 0.5));

                // NOW start tracking settlement
                isCoinFlipInProgress = true;
            });
        }

        function checkCoinSettled(delta) {
            if (!isCoinFlipInProgress) return;
            let isSettled = true;
            const threshold = 0.5; // Increased threshold
            if (coinBody.velocity.lengthSquared() > threshold || coinBody.angularVelocity.lengthSquared() > threshold) {
                isSettled = false;
            }
            if (isSettled) {
                timeSinceRest += delta;
            } else {
                timeSinceRest = 0;
            }

            if (timeSinceRest > 0.5) {
                // Fell through check
                const trayFloorY = gameViews.diceTray.controlsTarget.y;
                if (coinBody.position.y < trayFloorY - 2) {
                    document.getElementById("message").innerText = "Coin fell off! Flipping again...";
                    isCoinFlipInProgress = false;
                    setTimeout(() => startCoinFlip(), 1000); // Retry
                    return;
                }

                const result = getCoinResult(coinBody);
                finishCoinFlip(result);
            }
        }

        function getCoinResult(body) {
            const localUpVec = new CANNON.Vec3(0, 1, 0); // Local "Heads" face (Top)
            const worldUp = new CANNON.Vec3(0, 1, 0); // World up
            const coinFaceUp = body.quaternion.vmult(localUpVec);
            const dot = coinFaceUp.dot(worldUp);

            // dot > 0 means the "Heads" face is pointing more up than down
            // dot < 0 means the "Tails" face is pointing more up
            return (dot > 0) ? 'Heads' : 'Tails';
        }

        function finishCoinFlip(result) {
            isCoinFlipInProgress = false;

            // Show result panel
            const resultPanel = document.getElementById("coinFlipResult");
            const resultMsg = document.getElementById("coinFlipResultMessage");
            const continueBtn = document.getElementById("coinFlipContinueBtn");

            resultMsg.innerText = result.toUpperCase() + "!";
            resultPanel.style.display = "flex";

            continueBtn.onclick = () => {
                resultPanel.style.display = "none";

                // Hide coin, show dice
                coinMesh.visible = false;
                dice.forEach(d => d.mesh.visible = true);

                switchCameraView("board", () => {
                    resolveFaceOff(result);
                });
            };
        }


        // --- (Intro/Camera functions remain the same) ---
        function startIntro() {
            isCameraTransition = true;
            let idx = 0;
            function showNext() {
                if (idx >= players.length) {
                    isCameraTransition = false;
                    startTurnForActivePlayer();
                    return;
                }
                const p = players[idx];
                const camPos = p.mesh.position.clone().add(new THREE.Vector3(4, 8, 8));
                new TWEEN.Tween(camera.position).to(camPos, 1000).easing(TWEEN.Easing.Quadratic.InOut).onComplete(() => {
                    idx++;
                    showNext();
                }).start();
                new TWEEN.Tween(controls.target).to(p.mesh.position, 1000).easing(TWEEN.Easing.Quadratic.InOut).start();
            }
            showNext();
        }
        function highlightActivePlayer(player, done) {
            isCameraTransition = true;
            const originalScale = player.mesh.scale.clone();
            const targetScale = originalScale.clone().multiplyScalar(PLAYER_PULSE_SCALE);
            const playerPos = player.mesh.position;
            const playerRotY = player.mesh.rotation.y;
            const camDist = 8;
            const camHeight = 5;
            const spotlightPos = new THREE.Vector3(
                playerPos.x + Math.sin(playerRotY) * camDist,
                playerPos.y + camHeight,
                playerPos.z + Math.cos(playerRotY) * camDist
            );
            new TWEEN.Tween(camera.position).to(spotlightPos, 1200)
                .easing(TWEEN.Easing.Quadratic.InOut)
                .start();
            new TWEEN.Tween(controls.target).to(playerPos, 1200)
                .easing(TWEEN.Easing.Quadratic.InOut)
                .onComplete(() => {
                    const pulseUp = new TWEEN.Tween(player.mesh.scale).to({ x: targetScale.x, y: targetScale.y, z: targetScale.z }, 400).easing(TWEEN.Easing.Quadratic.Out);
                    const pulseDown = new TWEEN.Tween(player.mesh.scale).to({ x: originalScale.x, y: originalScale.y, z: originalScale.z }, 400).easing(TWEEN.Easing.Quadratic.In);
                    pulseUp.chain(pulseDown);
                    pulseDown.onComplete(() => {
                        updateBoardView();
                        new TWEEN.Tween(camera.position).to(gameViews.board.cameraPos, 800)
                            .easing(TWEEN.Easing.Quadratic.InOut)
                            .onComplete(() => {
                                isCameraTransition = false;
                                if (done) done();
                            }).start();
                        new TWEEN.Tween(controls.target).to(gameViews.board.controlsTarget, 800)
                            .easing(TWEEN.Easing.Quadratic.InOut)
                            .start();
                    });
                    pulseUp.start();
                }).start();
        }

        // --- MODIFIED TURN LOGIC ---

        function startTurnForActivePlayer() {
            const player = players[activePlayerIndex];
            document.getElementById("message").innerText = `Player ${activePlayerIndex + 1}'s Turn!`;
            updatePlayerStatsUI();
            highlightActivePlayer(player, () => {
                document.getElementById("ui").style.opacity = "1";
                document.getElementById("diceButton").disabled = false;
                updateHandUI();
                processTurnQueue();
            });
        }
        // --- MINIGAME WHEEL LOGIC ---
        // Map names to filenames
        const minigameFiles = {
            "Relay Race": "relay_race.html",
            "Platform Panic": "platform_panic.html",
            "Coin Collector": "coin_scramble.html",
            "Sumo Survivor": "sumo_survivor.html",
            "Tank Trouble": "tank_trouble.html",
            "Laser Lockup": "laser_tag.html"
        };
        const minigames = Object.keys(minigameFiles);

        function startMinigamePhase() {
            const panel = document.getElementById('minigameWheelPanel');
            const wheel = document.getElementById('wheel');
            const resultText = document.getElementById('wheelResult');
            const btn = document.getElementById('spinWheelBtn');

            panel.style.display = 'flex';
            wheel.style.transform = 'rotate(0deg)';
            resultText.style.opacity = '0';
            btn.style.display = 'block';

            btn.onclick = () => {
                btn.style.display = 'none';
                const spins = 5 + Math.random() * 5;
                const degrees = spins * 360 + Math.floor(Math.random() * 360);
                wheel.style.transform = `rotate(${degrees}deg)`;

                setTimeout(() => {
                    const normalizedDeg = degrees % 360;
                    const sectorSize = 360 / 6;
                    // Simple random pick for now to match visuals roughly
                    const winningGame = minigames[Math.floor(Math.random() * minigames.length)];

                    resultText.innerText = winningGame + "!";
                    resultText.style.opacity = '1';

                    setTimeout(() => {
                        // SAVE STATE AND REDIRECT
                        saveGameState();
                        const targetFile = minigameFiles[winningGame];
                        window.location.href = targetFile;
                    }, 2000);
                }, 4000);
            };
        }
        function finishMinigamePhase() {
            currentRound++;
            updatePlayerStatsUI();
            if (currentRound > maxRounds) {
                showRankings();
                return;
            }
            activePlayerIndex = 0;
            startTurnForActivePlayer();
        }

        function showRankings() {
            // 1. Sort Players
            const rankedPlayers = players.map((p, i) => ({
                id: i,
                stars: playerStars[i],
                coins: playerCoins[i]
            })).sort((a, b) => {
                if (b.stars !== a.stars) return b.stars - a.stars;
                return b.coins - a.coins;
            });

            // 2. Build UI
            const list = document.getElementById('rankingsList');
            list.innerHTML = '';

            const medals = ['🥇', '🥈', '🥉', 'Gw']; // GW = Good work? 4th place

            rankedPlayers.forEach((p, rank) => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-black/50 p-4 rounded-xl border-2 border-white/20 backdrop-blur-sm';
                if (rank === 0) {
                    row.style.background = 'linear-gradient(90deg, rgba(255,215,0,0.3), rgba(0,0,0,0.5))';
                    row.style.borderColor = '#ffd700';
                    row.style.transform = 'scale(1.05)';
                }

                row.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="text-4xl shadow-md">${medals[rank] || rank + 1 + '.'}</span>
                        <div class="flex flex-col">
                            <span class="text-2xl font-bold text-white">Player ${p.id + 1}</span>
                            <span class="text-sm text-gray-300">The Super Star</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-6">
                        <div class="flex items-center gap-2">
                            <span class="text-yellow-400 text-2xl">★</span>
                            <span class="text-2xl font-bold">${p.stars}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-yellow-200 text-xl">🪙</span>
                            <span class="text-xl font-bold">${p.coins}</span>
                        </div>
                    </div>
                `;
                list.appendChild(row);
            });

            // 3. Show Panel
            document.getElementById('rankingsPanel').style.display = 'flex';
            document.getElementById('ui').style.display = 'none'; // Hide game UI

            // Celebration Music or FX could go here
        }
        function nextTurn() {
            const isLastPlayer = activePlayerIndex === players.length - 1;
            if (isLastPlayer) {
                startMinigamePhase();
            } else {
                activePlayerIndex = (activePlayerIndex + 1) % players.length;
                startTurnForActivePlayer();
            }
        }

        /**
         * MODIFIED: Challenge logic
         */
        function checkForFaceOff(player) {
            const currentSpaceIndex = player.positionIndex;
            if (currentSpaceIndex === 0) {
                processTurnQueue();
                return;
            }
            const opponent = players.find(p => p.id !== player.id && p.positionIndex === currentSpaceIndex);
            if (opponent) {
                startFaceOff(player, opponent); // Pauses queue
            } else {
                processTurnQueue(); // Continues queue
            }
        }

        function startFaceOff(player, opponent) {
            faceOffChallenger = player;
            faceOffOpponent = opponent;
            const panel = document.getElementById("minigameFaceoff");
            const btn = document.getElementById("startFaceoffBtn");
            if (!panel || !btn) {
                console.error("Critical UI missing for FaceOff");
                startCoinFlip(); // Fallback
                return;
            }

            document.getElementById("faceoffPlayers").innerText = `Player ${player.id + 1} vs Player ${opponent.id + 1}!\nPlayer ${player.id + 1} is Heads. Player ${opponent.id + 1} is Tails.`;
            panel.style.display = "flex";

            btn.onclick = () => {
                panel.style.display = "none";
                startCoinFlip();
            };
        }

        /**
         * MODIFIED: High-stakes resolution (takes result from flip)
         */
        function resolveFaceOff(result) {
            const winner = (result === 'Heads') ? faceOffChallenger : faceOffOpponent;
            const loser = (winner === faceOffChallenger) ? faceOffOpponent : faceOffChallenger;

            document.getElementById("message").innerText = `Player ${winner.id + 1} wins the face-off! Player ${loser.id + 1} goes back to start!`;

            movePlayerToStart(loser, () => {
                processTurnQueue(); // Continue original player's turn
            });
        }

        function movePlayerToStart(player, onComplete) {
            player.positionIndex = 0;
            player.previousPositionIndex = 0;
            const startPosition = boardSpaces[0].position;
            const offsetX = (player.id % 2 === 0 ? -PLAYER_START_OFFSET : PLAYER_START_OFFSET);
            const offsetZ = (player.id < 2 ? -PLAYER_START_OFFSET : PLAYER_START_OFFSET);
            const y = startPosition.y + PLAYER_Y_OFFSET;
            const dest = new THREE.Vector3(startPosition.x + offsetX, y, startPosition.z + offsetZ);
            new TWEEN.Tween(player.mesh.position)
                .to(dest, 1500)
                .easing(TWEEN.Easing.Quadratic.InOut)
                .onComplete(onComplete)
                .start();
        }

        function movePlayerBack(e, t, o) { let a = 0; !function r() { a >= t || 0 === e.positionIndex ? o() : void 0 !== (d = boardSpaces[e.positionIndex].previous[0]) ? (e.previousPositionIndex = e.positionIndex, e.positionIndex = d, animateMove(e, r)) : o(); var d; a++ }() }

        function processTurnQueue() {
            if (turnActionQueue.length > 0) {
                const nextAction = turnActionQueue.shift();
                nextAction();
            }
        }

        function movePlayer(e) {
            let t = 0;
            const o = players[activePlayerIndex];
            !function a() {
                t >= e ?
                    processTurnQueue()
                    :
                    (() => {
                        const space = boardSpaces[o.positionIndex];
                        if (0 === space.next.length) {
                            document.getElementById("message").innerText = `Player ${o.id + 1} finished!`;
                            turnActionQueue = [nextTurn];
                            processTurnQueue();
                            return;
                        }
                        o.previousPositionIndex = o.positionIndex, o.positionIndex = space.next[0], animateMove(o, a)
                    })(), t++
            }()
        }

        function animateMove(player, callback) {
            const targetPos = boardSpaces[player.positionIndex].position;
            const y = targetPos.y + PLAYER_Y_OFFSET;
            const dest = new THREE.Vector3(targetPos.x, y, targetPos.z);
            const highlight = () => {
                const space = boardSpaces[player.positionIndex].mesh;
                const prevColor = space.material.emissive.getHex();
                space.material.emissive.setHex(0xffff00);
                const note = musicalScale[noteCounter % musicalScale.length];
                synth.triggerAttackRelease(note, "8n");
                noteCounter++;
                setTimeout(() => { space.material.emissive.setHex(prevColor); }, 400);
                if (callback) callback();
            };
            const startPos = player.mesh.position.clone();
            const targetRotY = Math.atan2(dest.x - startPos.x, dest.z - startPos.z);
            new TWEEN.Tween(player.mesh.rotation).to({ y: targetRotY }, 200).easing(TWEEN.Easing.Quadratic.Out).start();
            new TWEEN.Tween(player.mesh.position)
                .to({ y: y + 1.5 }, 200)
                .easing(TWEEN.Easing.Quadratic.Out)
                .chain(new TWEEN.Tween(player.mesh.position)
                    .to({ y: y }, 200)
                    .easing(TWEEN.Easing.Quadratic.In)
                ).start();
            new TWEEN.Tween(player.mesh.position)
                .to({ x: dest.x, z: dest.z }, 400)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onComplete(highlight)
                .start();
        }

        function updateBoardView() {
            if (players[activePlayerIndex]) {
                const pos = players[activePlayerIndex].mesh.position;
                gameViews.board.cameraPos.set(pos.x, pos.y + 10, pos.z + 8);
                gameViews.board.controlsTarget.copy(pos);
            }
        }

        function switchCameraView(e, t) {
            currentView = e;
            if (e === "board") updateBoardView();
            const o = gameViews[e];
            isCameraTransition = true;
            new TWEEN.Tween(camera.position).to(o.cameraPos, 1e3).easing(TWEEN.Easing.Quadratic.InOut).onComplete(() => { isCameraTransition = false, t && t(); }).start();
            new TWEEN.Tween(controls.target).to(o.controlsTarget, 1e3).easing(TWEEN.Easing.Quadratic.InOut).start()
        }

        function followPlayer() {
            if (currentView === 'board' && !isCameraTransition && players[activePlayerIndex]) {
                const pos = players[activePlayerIndex].mesh.position;
                const desiredCam = pos.clone().add(new THREE.Vector3(0, 10, 8));
                camera.position.lerp(desiredCam, 0.1);
                controls.target.lerp(pos, 0.1);
            }
        }

        function idleCamera(delta) {
            if (currentView === 'board' && !isCameraTransition && !isRollInProgress && !isCoinFlipInProgress && turnActionQueue.length === 0) {
                const center = controls.target;
                const offset = camera.position.clone().sub(center);
                offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), delta * 0.1);
                camera.position.copy(center.clone().add(offset));
            }
        }

        function updateEnvironment(delta) {
            timeOfDay = (timeOfDay + delta / 60) % 24;
            const angle = (timeOfDay / 24) * Math.PI * 2;
            const radius = 50;
            sun.position.set(Math.sin(angle) * radius, Math.cos(angle) * radius, 0);
            moon.position.set(Math.sin(angle + Math.PI) * radius, Math.cos(angle + Math.PI) * radius, 0);
            directionalLight.position.copy(sun.position);
            const dayFactor = Math.max(0, Math.cos(angle));
            directionalLight.intensity = 1.5 * dayFactor;
            ambientLight.intensity = 0.3 + 0.7 * dayFactor;
            const dayColor = new THREE.Color(0x87ceeb);
            const nightColor = new THREE.Color(0x000022);
            const skyColor = dayColor.clone().lerp(nightColor, 1 - dayFactor);
            scene.background = skyColor;
            scene.fog.color.copy(skyColor);
            stars.forEach(s => { s.material.opacity = 0.5 + 0.5 * Math.sin(clock.elapsedTime * 2 + s.userData.phase); });
            if (starObject && starSpaceIndex !== -1) {
                starObject.rotation.z += delta * 0.5;
                starObject.position.y = boardSpaces[starSpaceIndex].position.y + 0.7 + Math.sin(clock.elapsedTime * 3) * 0.2;
            }
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            world.step(1 / 60, delta, 3);

            // Update dice
            dice.forEach(d => {
                d.mesh.position.copy(d.body.position);
                d.mesh.quaternion.copy(d.body.quaternion);
            });

            // NEW: Update coin
            if (coinMesh && coinBody) {
                coinMesh.position.copy(coinBody.position);
                coinMesh.quaternion.copy(coinBody.quaternion);
            }

            // NEW: Conditional checks
            if (isRollInProgress) checkDiceSettled(delta);
            if (isCoinFlipInProgress) checkCoinSettled(delta);

            controls.update();
            TWEEN.update();
            followPlayer();
            idleCamera(delta);
            updateEnvironment(delta);
            renderer.render(scene, camera);
            if (minimapRenderer && minimapCamera) {
                minimapRenderer.render(scene, minimapCamera);
            }
        }

        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight, camera.updateProjectionMatrix(), renderer.setSize(window.innerWidth, window.innerHeight) }

        document.querySelectorAll('.player-select-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const index = parseInt(btn.getAttribute('data-player'));
                document.getElementById('playerSelect').style.display = 'none';
                init(index);
            });
        });
    </script>
</body>
