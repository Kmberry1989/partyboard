<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Partyverse - 3D Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        #container { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }
        .overlay-panel {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); display: none;
            flex-direction: column; gap: 1rem; background-color: rgba(0, 0, 0, 0.85);
            padding: 2rem; border-radius: 1rem; text-align: center;
            max-width: 90vw;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .btn {
            color: white; padding: 1rem 2rem; border-radius: 9999px;
            font-size: 1.125rem; font-weight: 600; border: none; cursor: pointer;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.2s ease-in-out;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { background-color: #6b7280; cursor: not-allowed; transform: none; }
        #diceButton { background-color: #4f46e5; }
        #diceButton:hover { background-color: #4338ca; }
        #message {
            color: white; font-size: 1.5rem; font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background-color: rgba(0,0,0,0.5);
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
        }
        .faceoffBtn { background-color: #ef4444; }
        .faceoffBtn:hover { background-color: #dc2626; }
        #playerHand {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            pointer-events: none;
        }
        .card {
            background-color: #fff;
            border: 3px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem;
            width: 150px;
            height: 210px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-12px) scale(1.05);
            border-color: #3b82f6;
        }
        .card-title {
            font-weight: 700;
            font-size: 1rem;
            color: #111827;
        }
        .card-desc {
            font-size: 0.875rem;
            color: #4b5563;
        }
        #cardPiles {
            position: absolute;
            bottom: 1rem;
            left: 3rem;
            display: flex;
            gap: 2rem;
            pointer-events: none;
        }
        .card-pile-outline {
            width: 100px;
            height: 140px;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .draw-pile {
            border: 4px dotted #3b82f6;
        }
        .discard-pile {
            border: 4px dotted #ef4444;
        }
        .pile-label {
            color: white;
            font-weight: 700;
            font-size: 1.25rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div id="ui">
            <div id="message">Player 1's Turn!</div>
        </div>
        <div id="playerHand"></div>
        <div id="cardPiles">
            <div class="card-pile-outline draw-pile">
                <div class="pile-label">DRAW</div>
            </div>
            <div class="card-pile-outline discard-pile">
                <div class="pile-label">DISCARD</div>
            </div>
        </div>
        <div id="minigameFaceoff" class="overlay-panel">
            <div id="faceoffMessage" class="text-white text-xl font-bold mb-2">FACE-OFF!</div>
            <div id="faceoffPlayers" class="text-white text-md mb-4"></div>
            <button id="startFaceoffBtn" class="btn faceoffBtn">Start Minigame!</button>
        </div>
        <div id="discardChoice" class="overlay-panel">
            <div id="discardMessage" class="text-white text-lg font-semibold mb-2">Choose a card to discard!</div>
            <div id="discardCardContainer" class="flex gap-4 flex-wrap justify-center"></div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@18.6.4/dist/tween.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

    <script>
        // === SCENE & PHYSICS SETUP ===
        let scene, camera, renderer, controls, world;
        const container = document.getElementById('container');
        let dice = [];
        let isRollInProgress = false;
        let timeSinceRest = 0;

        // === GAME STATE ===
        const boardSpaces = [];
        const players = [];
        const PLAYER_Y_OFFSET = 0.6;
        let activePlayerIndex = 0;
        const gameViews = {
            board: { cameraPos: new THREE.Vector3(15, 20, 12), controlsTarget: new THREE.Vector3(10, 0, -3) },
            diceTray: { cameraPos: new THREE.Vector3(0, 15, 15), controlsTarget: new THREE.Vector3(0, 10, 0) }
        };
        let turnActionQueue = [];

        // === CARD GAME STATE ===
        let deck = [];
        let discardPile = [];
        let playerHands = [[], [], [], []];
        let drawPile3D, discardPile3D;

        // === AUDIO STATE ===
        let synth;
        const musicalScale = ['C4', 'D4', 'E4', 'G4', 'A4', 'C5'];
        let noteCounter = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 10, 150);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(gameViews.board.cameraPos);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.copy(gameViews.board.controlsTarget);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(20, 40, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            const textureLoader = new THREE.TextureLoader();
            const grassTexture = textureLoader.load('assets/grass_texture.png');
            grassTexture.wrapS = THREE.RepeatWrapping;
            grassTexture.wrapT = THREE.RepeatWrapping;
            grassTexture.repeat.set(50, 50);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(300, 300), 
                new THREE.MeshLambertMaterial({ map: grassTexture })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            createBoard();
            createPlayers();
            initPhysics();
            initCardGame();
            
            synth = new Tone.Synth().toDestination();

            window.addEventListener('resize', onWindowResize, false);
            const diceButton = document.createElement('button');
            diceButton.id = 'diceButton';
            diceButton.className = 'btn';
            diceButton.innerText = 'Roll Dice';
            document.getElementById('ui').appendChild(diceButton);
            diceButton.addEventListener('click', startDiceRoll);

            animate();
        }

        function createBoard(){
            const spaceSize = 2, spaceGap = 0.5, totalSize = spaceSize + spaceGap, zOffset = -8, startPlatformOffset = -4;
            const pathData = [
                {pos:{x:0,z:0},next:[1]},{pos:{x:1,z:0},next:[2]},{pos:{x:2,z:0},next:[3]},{pos:{x:3,z:0},next:[4],type:'draw'},
                {pos:{x:4,z:0},next:[5]},{pos:{x:5,z:0},next:[6]},{pos:{x:5,z:1},next:[7]},{pos:{x:5,z:2},next:[8],type:'discard'},
                {pos:{x:4,z:2},next:[9]},{pos:{x:3,z:2},next:[10]},{pos:{x:2,z:2},next:[11]},{pos:{x:1,z:2},next:[12]},
                {pos:{x:0,z:2},next:[13],type:'draw'},{pos:{x:-1,z:2},next:[14]},{pos:{x:-1,z:3},next:[15]},{pos:{x:-1,z:4},next:[16]},
                {pos:{x:0,z:4},next:[17]},{pos:{x:1,z:4},next:[18],type:'discard'},{pos:{x:2,z:4},next:[19]},{pos:{x:3,z:4},next:[20]},
                {pos:{x:4,z:4},next:[21]},{pos:{x:5,z:4},next:[22]},{pos:{x:6,z:4},next:[23],type:'draw'},{pos:{x:7,z:4},next:[24]},
                {pos:{x:8,z:4},next:[25]},{pos:{x:8,z:3},next:[26]},{pos:{x:8,z:2},next:[27]},{pos:{x:8,z:1},next:[28]},
                {pos:{x:8,z:0},next:[29],type:'discard'},{pos:{x:9,z:0},next:[30]},{pos:{x:10,z:0},next:[]}
            ];
            
            pathData.forEach((data, index) => {
                const isStart = index === 0;
                const currentSpaceSize = isStart ? 5 : spaceSize;
                
                const spaceGeometry = new THREE.BoxGeometry(currentSpaceSize, 0.2, currentSpaceSize);
                const spaceMaterial = isStart 
                    ? new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })
                    : new THREE.MeshStandardMaterial({ color: (index % 2 === 0) ? 0xffffff : 0xaaaaaa });

                if (data.next.length === 0) spaceMaterial.color.setHex(0xffff00);
                
                const space = new THREE.Mesh(spaceGeometry, spaceMaterial);
                const yPos = isStart ? 2.0 : 0.1;
                const zPos = (data.pos.z * totalSize) + zOffset + (isStart ? startPlatformOffset : 0);
                const position = new THREE.Vector3(data.pos.x * totalSize, yPos, zPos);
                
                space.position.copy(position);
                space.castShadow = true;
                space.receiveShadow = true;
                scene.add(space);
                boardSpaces.push({ mesh: space, position: position, next: data.next, previous: [], type: data.type });

                if (data.type) {
                    const iconGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
                    const iconMat = new THREE.MeshStandardMaterial({ color: data.type === 'draw' ? 0x3b82f6 : 0xef4444 });
                    const icon = new THREE.Mesh(iconGeo, iconMat);
                    icon.position.set(position.x, position.y + 0.2, position.z);
                    scene.add(icon);
                }
            });

            boardSpaces.forEach((space, index) => {
                space.next.forEach(nextIndex => {
                    if (boardSpaces[nextIndex]) {
                        boardSpaces[nextIndex].previous.push(index);
                    }
                });
            });
        }

        function createPlayers(){
            const loader = new THREE.GLTFLoader();
            const playerModels = [
                'players/jonah.glb',
                'players/kyle.glb',
                'players/rochelle.glb',
                'players/vickie.glb'
            ];
            const startPosition = boardSpaces[0].position;

            playerModels.forEach((modelName, i) => {
                loader.load(modelName, (gltf) => {
                    const playerMesh = gltf.scene;
                    playerMesh.scale.set(0.5, 0.5, 0.5);
                    playerMesh.traverse(function (node) {
                        if (node.isMesh) { node.castShadow = true; }
                    });

                    const offsetX = (i % 2 === 0 ? -1 : 1) * 1.5;
                    const offsetZ = (i < 2 ? -1 : 1) * 1.5;
                    playerMesh.position.set(startPosition.x + offsetX, startPosition.y + PLAYER_Y_OFFSET, startPosition.z + offsetZ);
                    
                    scene.add(playerMesh);
                    players.push({ mesh: playerMesh, positionIndex: 0, previousPositionIndex: 0, id: i });
                },
                undefined,
                (error) => {
                    console.error(`An error happened loading model: ${modelName}`, error);
                });
            });
        }

        function createDiceMaterials(){
            const size = 128;
            const drawFace = (spots) => {
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0,0,size,size);
                ctx.fillStyle = '#000000';
                const r = size * 0.08;
                const pos = {
                    tl:[size*0.25,size*0.25], tc:[size*0.5,size*0.25], tr:[size*0.75,size*0.25],
                    ml:[size*0.25,size*0.5],  mc:[size*0.5,size*0.5],  mr:[size*0.75,size*0.5],
                    bl:[size*0.25,size*0.75], bc:[size*0.5,size*0.75], br:[size*0.75,size*0.75]
                };
                spots.forEach(key => {
                    const [x,y] = pos[key];
                    ctx.beginPath();
                    ctx.arc(x,y,r,0,Math.PI*2);
                    ctx.fill();
                });
                return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas) });
            };
            const faces = {
                1:['mc'],
                2:['tl','br'],
                3:['tl','mc','br'],
                4:['tl','tr','bl','br'],
                5:['tl','tr','mc','bl','br'],
                6:['tl','ml','bl','tr','mr','br']
            };
            return [
                drawFace(faces[1]),
                drawFace(faces[6]),
                drawFace(faces[2]),
                drawFace(faces[5]),
                drawFace(faces[3]),
                drawFace(faces[4])
            ];
        }

        function initPhysics(){
            world = new CANNON.World();
            world.gravity.set(0, -9.82 * 2, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;
            
            for (let i = 0; i < 2; i++) {
                const diceBody = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)) });
                const materials = createDiceMaterials();
                const threeMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), materials);
                threeMesh.castShadow = true;
                world.addBody(diceBody);
                scene.add(threeMesh);
                dice.push({ body: diceBody, mesh: threeMesh });
            }
            
            const trayPosition = new THREE.Vector3(0, 10, 0);
            const traySize = 10, wallHeight = 2, wallThickness = 0.5;
            const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            floorBody.position.copy(trayPosition);
            world.addBody(floorBody);
            
            const woodTexture = new THREE.TextureLoader().load('assets/wood_texture.png');
            const trayMaterial = new THREE.MeshStandardMaterial({ map: woodTexture });

            const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(traySize, wallThickness, traySize), trayMaterial);
            floorMesh.position.set(trayPosition.x, trayPosition.y - wallThickness / 2, trayPosition.z);
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);
            
            [{ p: [0, wallHeight/2, -traySize/2], s: [traySize, wallHeight, wallThickness] },{ p: [0, wallHeight/2, traySize/2], s: [traySize, wallHeight, wallThickness] },{ p: [-traySize/2, wallHeight/2, 0], s: [wallThickness, wallHeight, traySize] },{ p: [traySize/2, wallHeight/2, 0], s: [wallThickness, wallHeight, traySize] }].forEach(d => {
                const wallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(d.s[0]/2, d.s[1]/2, d.s[2]/2)) });
                wallBody.position.set(trayPosition.x + d.p[0], trayPosition.y + d.p[1], trayPosition.z + d.p[2]);
                world.addBody(wallBody);
                const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(...d.s), trayMaterial);
                wallMesh.position.copy(wallBody.position);
                wallMesh.castShadow = true;
                scene.add(wallMesh);
            });
        }

        function startDiceRoll(){
            if (Tone.context.state !== 'running') {
                Tone.context.resume();
            }
            noteCounter = 0;
            document.getElementById("diceButton").disabled=true;
            document.getElementById("ui").style.opacity="0";
            switchCameraView("diceTray",()=>{
                isRollInProgress=true;
                timeSinceRest=0;
                dice.forEach((e,t)=>{
                    e.body.position.set(2*t-1, 15, 2*(Math.random()-.5));
                    e.body.velocity.set(4*(Math.random()-.5),2+4*Math.random(),4*(Math.random()-.5));
                    e.body.angularVelocity.set(20*(Math.random()-.5),20*(Math.random()-.5),20*(Math.random()-.5));
                });
            });
        }

        function finishDiceRoll(e){isRollInProgress=!1;const t=e[0]+e[1];document.getElementById("message").innerText=`Player ${activePlayerIndex+1} rolled ${e[0]} + ${e[1]} = ${t}!`,switchCameraView("board",()=>{turnActionQueue.push(()=>movePlayer(t)),processTurnQueue()})}
        
        function checkDiceSettled(e){if(!isRollInProgress)return;let t=!0;const o=.2;dice.forEach(e=>{e.body.velocity.lengthSquared()>o||e.body.angularVelocity.lengthSquared()>o?t=!1:!0}),t?timeSinceRest+=e:timeSinceRest=0,timeSinceRest>.5&&(()=>{let e=!1;const t=dice.map(t=>(t.body.position.y<8&&(e=!0),getDiceResult(t.body)));e?(document.getElementById("message").innerText="Whoops! Fell off. Roll again!",switchCameraView("board",()=>{document.getElementById("ui").style.opacity="1",document.getElementById("diceButton").disabled=!1}),isRollInProgress=!1):finishDiceRoll(t)})()}
        
        function getDiceResult(e){const t=new CANNON.Vec3(0,1,0);let o=-1,a=-1;return[{v:new CANNON.Vec3(0,0,1),r:1},{v:new CANNON.Vec3(0,0,-1),r:6},{v:new CANNON.Vec3(0,1,0),r:2},{v:new CANNON.Vec3(0,-1,0),r:5},{v:new CANNON.Vec3(1,0,0),r:3},{v:new CANNON.Vec3(-1,0,0),r:4}].forEach(r=>{const d=e.quaternion.vmult(r.v),i=d.dot(t);i>o&&(o=i,a=r.r)}),a}
        
        function nextTurn(){activePlayerIndex=(activePlayerIndex+1)%players.length,document.getElementById("message").innerText=`Player ${activePlayerIndex+1}'s Turn!`,document.getElementById("ui").style.opacity="1",document.getElementById("diceButton").disabled=!1,updateHandUI(),processTurnQueue()}
        
        function checkForFaceOff(e,t){const o=e.positionIndex,a=players.find(t=>t.id!==e.id&&t.positionIndex===o);a?startFaceOff(e,a):t()}
        
        function startFaceOff(e,t){const o=document.getElementById("minigameFaceoff");document.getElementById("faceoffPlayers").innerText=`Player ${e.id+1} vs Player ${t.id+1}`,o.style.display="flex",document.getElementById("startFaceoffBtn").onclick=()=>{o.style.display="none",resolveFaceOff(e,t)}}
        
        function resolveFaceOff(e,t){const o=.5>Math.random()?e:t,a=o===e?t:e;document.getElementById("message").innerText=`Player ${o.id+1} wins the face-off!`,movePlayerBack(a,3,()=>{processTurnQueue()})}
        
        function movePlayerBack(e,t,o){let a=0;!function r(){a>=t||0===e.positionIndex?o():void 0!==(d=boardSpaces[e.positionIndex].previous[0])?(e.previousPositionIndex=e.positionIndex,e.positionIndex=d,animateMove(e,r)):o();var d;a++}()}
        
        function processTurnQueue(){if(turnActionQueue.length>0){(0,turnActionQueue.shift())()}}
        
        function movePlayer(e){let t=0;const o=players[activePlayerIndex];!function a(){t>=e?turnActionQueue.push(()=>checkForFaceOff(o,()=>{turnActionQueue.push(()=>handleSpaceAction(o,()=>{turnActionQueue.push(nextTurn),processTurnQueue()})),processTurnQueue()})):(()=>{const e=boardSpaces[o.positionIndex];if(0===e.next.length)return document.getElementById("message").innerText=`Player ${o.id+1} finished!`,turnActionQueue.push(nextTurn),void processTurnQueue();o.previousPositionIndex=o.positionIndex,o.positionIndex=e.next[0],animateMove(o,a)})(),t++}()}
        
        function animateMove(e,t){const o=boardSpaces[e.positionIndex].position,a=e.id,r=.3*(a%2==0?-1:1),d=.3*(a<2?-1:1),i=o.y+PLAYER_Y_OFFSET,c=new THREE.Vector3(o.x+r,i,o.z+d);const l=()=>{const t=boardSpaces[e.positionIndex].mesh,o=t.material.emissive.getHex();t.material.emissive.setHex(16776960);const a=musicalScale[noteCounter%musicalScale.length];synth.triggerAttackRelease(a,"8n"),noteCounter++,setTimeout(()=>{t.material.emissive.setHex(o)},400),t&&t()};if(0===e.previousPositionIndex){const a=e.mesh.position.clone(),r=a.clone().lerp(c,.5);r.y+=3;const d=new TWEEN.Tween(e.mesh.position).to(r,300).easing(TWEEN.Easing.Quadratic.Out),i=new TWEEN.Tween(e.mesh.position).to(c,300).easing(TWEEN.Easing.Quadratic.In);d.chain(i),i.onComplete(l),d.start()}else new TWEEN.Tween(e.mesh.position).to(c,400).easing(TWEEN.Easing.Quadratic.Out).onComplete(l).start()}
        
        function switchCameraView(e,t){const o=gameViews[e];new TWEEN.Tween(camera.position).to(o.cameraPos,1e3).easing(TWEEN.Easing.Quadratic.InOut).start(),new TWEEN.Tween(controls.target).to(o.controlsTarget,1e3).easing(TWEEN.Easing.Quadratic.InOut).onComplete(t).start()}
        
        const clock = new THREE.Clock();
        function animate(){requestAnimationFrame(animate);const e=clock.getDelta();world.step(1/60,e,3),dice.forEach(e=>{e.mesh.position.copy(e.body.position),e.mesh.quaternion.copy(e.body.quaternion)}),checkDiceSettled(e),controls.update(),TWEEN.update(),renderer.render(scene,camera)}
        
        function onWindowResize(){camera.aspect=window.innerWidth/window.innerHeight,camera.updateProjectionMatrix(),renderer.setSize(window.innerWidth,window.innerHeight)}
        
        init();
    </script>
</body>
</html>
