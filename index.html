<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Partyverse - 3D Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        #container { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }
        .overlay-panel {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); display: none;
            flex-direction: column; gap: 1rem; background-color: rgba(0, 0, 0, 0.85);
            padding: 2rem; border-radius: 1rem; text-align: center;
            max-width: 90vw;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .btn {
            color: white; padding: 1rem 2rem; border-radius: 9999px;
            font-size: 1.125rem; font-weight: 600; border: none; cursor: pointer;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.2s ease-in-out;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { background-color: #6b7280; cursor: not-allowed; transform: none; }
        #diceButton { background-color: #4f46e5; }
        #diceButton:hover { background-color: #4338ca; }
        #message {
            color: white; font-size: 1.5rem; font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background-color: rgba(0,0,0,0.5);
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
        }
        .faceoffBtn { background-color: #ef4444; }
        .faceoffBtn:hover { background-color: #dc2626; }
        #playerHand {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            pointer-events: none;
        }
        .card {
            background-color: #fff;
            border: 3px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem;
            width: 150px;
            height: 210px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-12px) scale(1.05);
            border-color: #3b82f6;
        }
        .card-title {
            font-weight: 700;
            font-size: 1rem;
            color: #111827;
        }
        .card-desc {
            font-size: 0.875rem;
            color: #4b5563;
        }
        #cardPiles {
            position: absolute;
            bottom: 1rem;
            left: 3rem;
            display: flex;
            gap: 2rem;
            pointer-events: none;
        }
        .card-pile-outline {
            width: 100px;
            height: 140px;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .draw-pile {
            border: 4px dotted #3b82f6;
        }
        .discard-pile {
            border: 4px dotted #ef4444;
        }
        .pile-label {
            color: white;
            font-weight: 700;
            font-size: 1.25rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div id="ui">
            <div id="message">Player 1's Turn!</div>
        </div>
        <div id="playerHand"></div>
        <div id="cardPiles">
            <div class="card-pile-outline draw-pile">
                <div class="pile-label">DRAW</div>
            </div>
            <div class="card-pile-outline discard-pile">
                <div class="pile-label">DISCARD</div>
            </div>
        </div>
        <div id="minigameFaceoff" class="overlay-panel">
            <div id="faceoffMessage" class="text-white text-xl font-bold mb-2">FACE-OFF!</div>
            <div id="faceoffPlayers" class="text-white text-md mb-4"></div>
            <button id="startFaceoffBtn" class="btn faceoffBtn">Start Minigame!</button>
        </div>
        <div id="discardChoice" class="overlay-panel">
            <div id="discardMessage" class="text-white text-lg font-semibold mb-2">Choose a card to discard!</div>
            <div id="discardCardContainer" class="flex gap-4 flex-wrap justify-center"></div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@18.6.4/dist/tween.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        // === SCENE & PHYSICS SETUP ===
        let scene, camera, renderer, controls, world;
        const container = document.getElementById('container');
        let dice = [];
        let isRollInProgress = false;
        let timeSinceRest = 0;

        // === GAME STATE ===
        const boardSpaces = [];
        const players = [];
        let activePlayerIndex = 0;
        const gameViews = {
            board: { cameraPos: new THREE.Vector3(15, 20, 12), controlsTarget: new THREE.Vector3(10, 0, -3) },
            diceTray: { cameraPos: new THREE.Vector3(0, 10, 15), controlsTarget: new THREE.Vector3(0, 1, 0) }
        };
        let turnActionQueue = [];

        // === CARD GAME STATE ===
        let deck = [];
        let discardPile = [];
        let playerHands = [[], [], [], []];
        let drawPile3D, discardPile3D;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 10, 150);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(gameViews.board.cameraPos);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.copy(gameViews.board.controlsTarget);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(20, 40, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x55aa55 }));
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            createBoard();
            createPlayers();
            initPhysics();
            initCardGame();

            window.addEventListener('resize', onWindowResize, false);
            const diceButton = document.createElement('button');
            diceButton.id = 'diceButton';
            diceButton.className = 'btn';
            diceButton.innerText = 'Roll Dice';
            document.getElementById('ui').appendChild(diceButton);
            diceButton.addEventListener('click', startDiceRoll);

            animate();
        }

        function createPlayers() {
            const loader = new THREE.GLTFLoader();
            // Player model files live in the local "players" directory
            const playerModels = [
                'players/jonah.glb',
                'players/kyle.glb',
                'players/rochelle.glb',
                'players/vickie.glb'
            ];
            const startPosition = boardSpaces[0].position;

            playerModels.forEach((modelName, i) => {
                loader.load(modelName, (gltf) => {
                    const playerMesh = gltf.scene;
                    playerMesh.scale.set(0.5, 0.5, 0.5); // Adjust scale as needed
                    playerMesh.traverse(function (node) {
                        if (node.isMesh) { node.castShadow = true; }
                    });

                    const offsetX = (i % 2 === 0 ? -1 : 1) * 1.5;
                    const offsetZ = (i < 2 ? -1 : 1) * 1.5;
                    playerMesh.position.set(startPosition.x + offsetX, startPosition.y, startPosition.z + offsetZ);
                    
                    scene.add(playerMesh);
                    players.push({ mesh: playerMesh, positionIndex: 0, previousPositionIndex: 0, id: i });
                },
                undefined, // onProgress callback (optional)
                (error) => {
                    console.error(`An error happened loading model: ${modelName}`, error);
                });
            });
        }
        
        // --- (All other functions remain largely the same) ---

        function initCardGame() {
            const cardTypes = [
                { title: "Extra Step", desc: "Move 1 extra space." },
                { title: "Shortcut", desc: "Jump to the next fork." },
                { title: "Go Back", desc: "Send an opponent back 2 spaces." },
                { title: "Shield", desc: "Block a negative effect." },
                { title: "Double Roll", desc: "Roll two dice next turn." }
            ];
            for (let i = 0; i < 20; i++) {
                deck.push(cardTypes[i % cardTypes.length]);
            }
            deck.sort(() => Math.random() - 0.5);

            drawPile3D = new THREE.Group();
            discardPile3D = new THREE.Group();
            drawPile3D.position.set(-8, 0.1, 8);
            discardPile3D.position.set(8, 0.1, 8);
            scene.add(drawPile3D, discardPile3D);
            
            const outlineGeo = new THREE.BoxGeometry(2.5, 0.1, 3.5);
            const drawOutlineMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true });
            const discardOutlineMat = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true });
            const drawOutline = new THREE.Mesh(outlineGeo, drawOutlineMat);
            const discardOutline = new THREE.Mesh(outlineGeo, discardOutlineMat);
            drawOutline.position.copy(drawPile3D.position);
            discardOutline.position.copy(discardPile3D.position);
            scene.add(drawOutline, discardOutline);

            for(let i=0; i<4; i++) {
                drawCard(i);
                drawCard(i);
            }
            update3DCardPiles();
            updateHandUI();
        }

        function update3DCardPiles() {
            drawPile3D.children.forEach(c => drawPile3D.remove(c));
            discardPile3D.children.forEach(c => discardPile3D.remove(c));

            const cardGeo = new THREE.BoxGeometry(2.2, 0.05, 3.2);
            const cardMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

            for (let i = 0; i < deck.length; i++) {
                const cardMesh = new THREE.Mesh(cardGeo, cardMat);
                cardMesh.position.y = i * 0.06;
                drawPile3D.add(cardMesh);
            }
            for (let i = 0; i < discardPile.length; i++) {
                const cardMesh = new THREE.Mesh(cardGeo, cardMat);
                cardMesh.position.y = i * 0.06;
                discardPile3D.add(cardMesh);
            }
        }

        function drawCard(playerIndex) {
            if (deck.length === 0) {
                deck = [...discardPile];
                discardPile = [];
                deck.sort(() => Math.random() - 0.5);
            }
            const card = deck.pop();
            if (card) {
                playerHands[playerIndex].push(card);
            }
            update3DCardPiles();
            updateHandUI();
        }

        function discardCard(playerIndex, cardIndex) {
            if (playerHands[playerIndex][cardIndex]) {
                const [card] = playerHands[playerIndex].splice(cardIndex, 1);
                discardPile.push(card);
                update3DCardPiles();
                updateHandUI();
            }
        }
        
        function updateHandUI() {
            const handContainer = document.getElementById('playerHand');
            handContainer.innerHTML = '';
            playerHands[activePlayerIndex].forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `<div class="card-title">${card.title}</div><div class="card-desc">${card.desc}</div>`;
                handContainer.appendChild(cardEl);
            });
        }

        function createBoard(){
            const spaceSize = 2, spaceGap = 0.5, totalSize = spaceSize + spaceGap, zOffset = -8, startPlatformOffset = -4;
            const pathData = [
                {pos:{x:0,z:0},next:[1]}, {pos:{x:1,z:0},next:[2]}, {pos:{x:2,z:0},next:[3]},

                {pos:{x:-1,z:2},next:[10]}, {pos:{x:-1,z:3},next:[11],type:'draw'}, {pos:{x:-1,z:4},next:[12]},
                {pos:{x:0,z:4},next:[13]}, {pos:{x:1,z:4},next:[14]}, {pos:{x:2,z:4},next:[15]},
                {pos:{x:3,z:4},next:[16]}, {pos:{x:4,z:4},next:[17]}, {pos:{x:5,z:0},next:[18]},
                {pos:{x:6,z:0},next:[19]}, {pos:{x:7,z:0},next:[]}
            ];
            
            pathData.forEach((data, index) => {
                const isStart = index === 0;
                const currentSpaceSize = isStart ? 5 : spaceSize;
                let color = (index % 2 === 0) ? 0xffffff : 0xaaaaaa;
                if (isStart) color = 0x00ff00;
                if (data.next.length === 0) color = 0xffff00;
                
                const spaceGeometry = new THREE.BoxGeometry(currentSpaceSize, 0.2, currentSpaceSize);
                const spaceMaterial = new THREE.MeshStandardMaterial({ color: color });
                const space = new THREE.Mesh(spaceGeometry, spaceMaterial);
                const yPos = isStart ? 2.0 : 0.1;
                const zPos = (data.pos.z * totalSize) + zOffset + (isStart ? startPlatformOffset : 0);
                const position = new THREE.Vector3(data.pos.x * totalSize, yPos, zPos);
                
                space.position.copy(position);
                space.castShadow = true;
                space.receiveShadow = true;
                scene.add(space);
                boardSpaces.push({ position: position, next: data.next, previous: [], type: data.type });

                if (data.type) {
                    const iconGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
                    const iconMat = new THREE.MeshStandardMaterial({ color: data.type === 'draw' ? 0x3b82f6 : 0xef4444 });
                    const icon = new THREE.Mesh(iconGeo, iconMat);
                    icon.position.set(position.x, position.y + 0.2, position.z);
                    scene.add(icon);
                }
            });

            boardSpaces.forEach((space, index) => {
                space.next.forEach(nextIndex => {
                    if (boardSpaces[nextIndex]) {
                        boardSpaces[nextIndex].previous.push(index);
                    }
                });
            });
        }
        
        function handleSpaceAction(player, onComplete) {
            const space = boardSpaces[player.positionIndex];
            if (!space.type) {
                onComplete();
                return;
            }

            if (space.type === 'draw') {
                document.getElementById('message').innerText = `Player ${player.id + 1} draws a card!`;
                drawCard(player.id);
                setTimeout(onComplete, 1000);
            } else if (space.type === 'discard') {
                if (playerHands[player.id].length === 0) {
                    document.getElementById('message').innerText = `Player ${player.id + 1} has no cards to discard.`;
                    setTimeout(onComplete, 1000);
                    return;
                }
                
                const panel = document.getElementById('discardChoice');
                const container = document.getElementById('discardCardContainer');
                container.innerHTML = '';

                playerHands[player.id].forEach((card, index) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';
                    cardEl.innerHTML = `<div class="card-title">${card.title}</div><div class="card-desc">${card.desc}</div>`;
                    cardEl.onclick = () => {
                        discardCard(player.id, index);
                        panel.style.display = 'none';
                        onComplete();
                    };
                    container.appendChild(cardEl);
                });
                panel.style.display = 'flex';
            } else {
                onComplete();
            }
        }

        function nextTurn(){activePlayerIndex=(activePlayerIndex+1)%players.length,document.getElementById("message").innerText=`Player ${activePlayerIndex+1}'s Turn!`,document.getElementById("ui").style.opacity="1",document.getElementById("diceButton").disabled=!1,updateHandUI(),processTurnQueue()}
        function checkForFaceOff(e,t){const o=e.positionIndex,a=players.find(t=>t.id!==e.id&&t.positionIndex===o);a?startFaceOff(e,a):t()}
        function startFaceOff(e,t){const o=document.getElementById("minigameFaceoff");document.getElementById("faceoffPlayers").innerText=`Player ${e.id+1} vs Player ${t.id+1}`,o.style.display="flex",document.getElementById("startFaceoffBtn").onclick=()=>{o.style.display="none",resolveFaceOff(e,t)}}
        function resolveFaceOff(e,t){const o=Math.random()<.5?e:t,a=o===e?t:e;document.getElementById("message").innerText=`Player ${o.id+1} wins the face-off!`,movePlayerBack(a,3,()=>{processTurnQueue()})}

        function animateMove(e,t){const o=boardSpaces[e.positionIndex].position,a=e.id,n=.3*(a%2==0?-1:1),i=.3*(a<2?-1:1),s=o.y,r=new THREE.Vector3(o.x+n,s,o.z+i);if(0===e.previousPositionIndex){const a=e.mesh.position.clone(),n=a.clone().lerp(r,.5);n.y+=3;const i=new TWEEN.Tween(e.mesh.position).to(n,300).easing(TWEEN.Easing.Quadratic.Out),s=new TWEEN.Tween(e.mesh.position).to(r,300).easing(TWEEN.Easing.Quadratic.In);i.chain(s),s.onComplete(t),i.start()}else new TWEEN.Tween(e.mesh.position).to(r,400).easing(TWEEN.Easing.Quadratic.Out).onComplete(t).start()}
        function switchCameraView(e,t){const o=gameViews[e];new TWEEN.Tween(camera.position).to(o.cameraPos,1e3).easing(TWEEN.Easing.Quadratic.InOut).start(),new TWEEN.Tween(controls.target).to(o.controlsTarget,1e3).easing(TWEEN.Easing.Quadratic.InOut).onComplete(t).start()}
        const clock = new THREE.Clock();
        function animate(){requestAnimationFrame(animate);const e=clock.getDelta();world.step(1/60,e,3),dice.forEach(e=>{e.mesh.position.copy(e.body.position),e.mesh.quaternion.copy(e.body.quaternion)}),checkDiceSettled(e),controls.update(),TWEEN.update(),renderer.render(scene,camera)}
        function onWindowResize(){camera.aspect=window.innerWidth/window.innerHeight,camera.updateProjectionMatrix(),renderer.setSize(window.innerWidth,window.innerHeight)}
        
        init();
    </script>
