<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Lockup - PartyVerse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-text {
            color: #00ff00;
            font-weight: 800;
            font-size: 2rem;
            text-shadow: 0 0 10px #00ff00;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        #startScreen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .btn {
            background: black;
            color: #00ff00;
            padding: 1rem 3rem;
            border: 2px solid #00ff00;
            font-size: 2rem;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 20px #00ff00;
        }

        .btn:hover {
            background: #00ff00;
            color: black;
        }
    </style>
</head>

<body>
    <div id="crosshair"></div>
    <div id="startScreen">
        <h1 class="text-6xl font-bold mb-4 text-[#00ff00] drop-shadow-[0_0_10px_rgba(0,255,0,0.8)]">LASER LOCKUP</h1>
        <p class="text-xl text-green-300 mb-8">Score points by tagging bots! 60 Seconds.</p>
        <button id="startBtn" class="btn">ACTIVATE</button>
    </div>

    <div id="ui">
        <div class="flex justify-between w-full">
            <div id="score" class="hud-text">SCORE: 0</div>
            <div id="timer" class="hud-text">TIME: 60</div>
        </div>
        <div class="hud-text text-sm opacity-75 text-center w-full">WASD Move • Mouse/Touch Aim • SPACE Shoot</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        let scene, camera, renderer, world;
        let playerBody, playerMesh; // First person mostly
        let lasers = [];
        let bots = [];
        let score = 0;
        let timeLeft = 60;
        let gameActive = false;
        let lastShootTime = 0;

        let mainState = JSON.parse(localStorage.getItem('partyBoardState') || "{}");
        let activePlayerId = mainState.activePlayerIndex || 0;

        // Input state
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let yaw = 0;
        let pitch = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Neon Lights
            const ambient = new THREE.AmbientLight(0x001100, 0.5);
            scene.add(ambient);

            // Random coloured lights
            for (let i = 0; i < 10; i++) {
                const l = new THREE.PointLight(Math.random() * 0xffffff, 1, 20);
                l.position.set((Math.random() - 0.5) * 40, 5, (Math.random() - 0.5) * 40);
                scene.add(l);
            }

            world = new CANNON.World();
            world.gravity.set(0, -20, 0);

            // Arena
            createArena();
            createPlayer();
            spawnBots(); // 5 bots

            document.getElementById('startBtn').onclick = startGame;

            // Mouse Look
            document.addEventListener('mousemove', (e) => {
                if (!gameActive) return;
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            document.body.addEventListener('click', () => {
                if (!gameActive) return;
                document.body.requestPointerLock();
                shoot();
            });

            loop();
        }

        function createArena() {
            // Floor
            const florGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const floor = new THREE.Mesh(florGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);

            // Pillars
            const boxGeo = new THREE.BoxGeometry(2, 6, 2);
            const boxMat = new THREE.MeshBasicMaterial({ color: 0x004400, wireframe: true });

            for (let i = 0; i < 20; i++) {
                const mesh = new THREE.Mesh(boxGeo, boxMat);
                const x = (Math.random() - 0.5) * 50;
                const z = (Math.random() - 0.5) * 50;
                mesh.position.set(x, 3, z);
                scene.add(mesh);

                const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1, 3, 1)) });
                body.position.copy(mesh.position);
                world.addBody(body);
            }
        }

        function createPlayer() {
            const shape = new CANNON.Sphere(1);
            playerBody = new CANNON.Body({ mass: 10, fixedRotation: true, linearDamping: 0.9 });
            playerBody.addShape(shape);
            playerBody.position.set(0, 2, 0);
            world.addBody(playerBody);
        }

        function spawnBots() {
            for (let i = 0; i < 5; i++) {
                spawnBot();
            }
        }

        function spawnBot() {
            const bot = { mesh: null, body: null, nextMove: 0 };
            const shape = new CANNON.Sphere(1);
            const body = new CANNON.Body({ mass: 10, fixedRotation: true, linearDamping: 0.9 });
            body.addShape(shape);
            body.position.set((Math.random() - 0.5) * 40, 2, (Math.random() - 0.5) * 40);
            world.addBody(body);
            bot.body = body;

            // Simple Drone Look
            const geo = new THREE.SphereGeometry(1, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
            const mesh = new THREE.Mesh(geo, mat);
            scene.add(mesh);
            bot.mesh = mesh;

            bots.push(bot);
        }

        function startGame() {
            gameActive = true;
            document.getElementById('startScreen').style.display = 'none';
            document.body.requestPointerLock();

            const timer = setInterval(() => {
                if (!gameActive) { clearInterval(timer); return; }
                timeLeft--;
                document.getElementById('timer').innerText = `TIME: ${timeLeft}`;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function shoot() {
            // Visual Laser
            const start = new THREE.Vector3();
            const dir = new THREE.Vector3();
            camera.getWorldPosition(start);
            camera.getWorldDirection(dir);
            // Lower slightly for gun pos
            start.y -= 0.2;

            const end = start.clone().add(dir.multiplyScalar(50));

            const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
            const mat = new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 1 });
            const line = new THREE.Line(geo, mat);
            scene.add(line);

            // Fade out
            let op = 1;
            const fade = setInterval(() => {
                op -= 0.1;
                line.material.opacity = op;
                if (op <= 0) {
                    scene.remove(line);
                    clearInterval(fade);
                }
            }, 50);

            // Hit Check (Raycast logic simplified)
            const ray = new THREE.Raycaster(camera.position, camera.getWorldDirection(new THREE.Vector3()));
            const intersects = ray.intersectObjects(bots.map(b => b.mesh));

            if (intersects.length > 0) {
                const hitBotMesh = intersects[0].object;
                const botIndex = bots.findIndex(b => b.mesh === hitBotMesh);
                if (botIndex !== -1) {
                    // Respawn Bot
                    const b = bots[botIndex];
                    b.body.position.set((Math.random() - 0.5) * 40, 2, (Math.random() - 0.5) * 40);
                    b.body.velocity.set(0, 0, 0);

                    score++;
                    document.getElementById('score').innerText = `SCORE: ${score}`;

                    // Hit Effect
                    hitBotMesh.material.color.setHex(0xffffff);
                    setTimeout(() => hitBotMesh.material.color.setHex(0xff0000), 100);
                }
            }
        }

        // Logic Loop
        function loop() {
            requestAnimationFrame(loop);
            if (!gameActive) return;

            world.step(1 / 60);

            // Player Move
            const speed = 20;
            const velocity = new THREE.Vector3();
            if (keys.w) velocity.z = -speed;
            if (keys.s) velocity.z = speed;
            if (keys.a) velocity.x = -speed;
            if (keys.d) velocity.x = speed;

            // Action button shoots if not using mouse
            if (keys.space && Date.now() - lastShootTime > 300) {
                shoot();
                lastShootTime = Date.now();
            }

            // Transform local velocity to camera direction
            velocity.applyEuler(new THREE.Euler(0, yaw, 0));
            playerBody.velocity.x = velocity.x;
            playerBody.velocity.z = velocity.z;

            camera.position.copy(playerBody.position).add(new THREE.Vector3(0, 0.5, 0));

            // Bot Update
            bots.forEach(b => {
                b.mesh.position.copy(b.body.position);
                if (Math.random() < 0.02) {
                    b.body.velocity.set((Math.random() - 0.5) * 10, 0, (Math.random() - 0.5) * 10);
                }
            });
        }

        // Keys
        window.onkeydown = (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if (e.key === ' ') keys.space = true;
        };
        window.onkeyup = (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            if (e.key === ' ') keys.space = false;
        };

        function endGame() {
            gameActive = false;
            document.exitPointerLock();

            document.getElementById('startScreen').innerHTML = `
                <h1 class='text-6xl text-white'>MISSION COMPLETE</h1>
                <p class='text-2xl text-green-400'>Score: ${score}</p>
            `;
            document.getElementById('startScreen').style.display = 'flex';

            const reward = score + 5; // Base 5 + score
            mainState.playerCoins[activePlayerId] += reward;
            localStorage.setItem('partyBoardState', JSON.stringify(mainState));

            setTimeout(() => window.location.href = 'index.html', 3000);
        }

        init();
    </script>
    <script src="assets/mobile_controls.js"></script>
</body>

</html>
