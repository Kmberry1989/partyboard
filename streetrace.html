<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Character Viewer</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
    #loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 24px;
      letter-spacing: 0.3px;
      background: #000;
      z-index: 10;
    }
    #diag {
      position: fixed;
      right: 12px;
      bottom: 12px;
      max-width: 420px;
      background: rgba(0,0,0,0.6);
      color: #e7e7e7;
      font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      padding: 10px 12px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      white-space: pre-wrap;
      max-height: 50vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="loader">Loading…</div>
  <div id="diag" aria-live="polite">Diagnostics: starting…</div>

  <!-- Three.js library via import map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    // --- Core Scene Components ---
    let scene, camera, renderer;
    let controls;
    const models = []; // interactive character models (scenes)
    let raycaster, mouse;
    let hoveredObject = null;
    let stars, cloudParticles = [];

    // --- CHANGE: Increased character scale again ---
    const CHARACTER_BASE_SCALE = 3.5;
    const CHARACTER_HOVER_SCALE = 3.8;

    // --- Character and Car Data ---
    const GITHUB_BASE = 'https://raw.githubusercontent.com/Kmberry1989/partyboard/main/players/';
    const characters = [
      {
        name: 'jonah',
        file: GITHUB_BASE + 'jonah.glb',
        carFile: GITHUB_BASE + 'jonah_toyota_scion.glb',
        position: new THREE.Vector3(-24, 0, 4),
        // --- CHANGE: Positioned characters in front of the car's center ---
        characterOffset: new THREE.Vector3(0, 0, -3.5), 
        headlightPositions: [
            new THREE.Vector3(0.5387, 0.6314, -1.481),
            new THREE.Vector3(-0.5093, 0.6354, -1.533)
        ]
      },
      {
        name: 'vickie',
        file: GITHUB_BASE + 'vickie.glb',
        carFile: GITHUB_BASE + 'vickie_chevrolet_sonic.glb',
        position: new THREE.Vector3(-8, 0, 2),
        characterOffset: new THREE.Vector3(0, 0, -3.5),
        headlightPositions: [
            new THREE.Vector3(0.5377, 0.6054, -1.53),
            new THREE.Vector3(-0.5623, 0.6054, -1.53)
        ]
      },
      {
        name: 'rochelle',
        file: GITHUB_BASE + 'rochelle.glb',
        carFile: GITHUB_BASE + 'rochelle_ford_fusion.glb',
        position: new THREE.Vector3(8, 0, 0),
        characterOffset: new THREE.Vector3(0, 0, -3.5),
        headlightPositions: [
            new THREE.Vector3(0.5377, 0.6554, -1.53),
            new THREE.Vector3(-0.5623, 0.6554, -1.53)
        ]
      },
      {
        name: 'kyle',
        file: GITHUB_BASE + 'kyle.glb',
        carFile: GITHUB_BASE + 'kyle_hyundai_elantra.glb',
        position: new THREE.Vector3(24, 0, -2),
        characterOffset: new THREE.Vector3(0, 0, -3.5),
        headlightPositions: [
            new THREE.Vector3(0.5623, 0.5854, -1.43),
            new THREE.Vector3(-0.5623, 0.5854, -1.43)
        ]
      }
    ];

    // --- Diagnostics ---
    const diagEl = document.getElementById('diag');
    function logDiag(line) {
      if (!diagEl) return;
      diagEl.textContent += (diagEl.textContent ? '\n' : '') + line;
      diagEl.scrollTop = diagEl.scrollHeight; // Auto-scroll
    }

    let loadedCharacters = 0;
    let loadedCars = 0;
    const failedURLs = new Set();

    init();
    animate();

    function init() {
      // --- Scene Setup ---
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050518); // Deep blue night sky
      scene.fog = new THREE.FogExp2(0x050518, 0.015);

      // --- Camera Setup ---
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 18);

      // --- Renderer Setup ---
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      // --- Controls ---
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.zoomSpeed = 0.5;
      controls.panSpeed = 0.5;
      controls.minDistance = 5; 
      controls.maxDistance = 60; 
      controls.maxPolarAngle = Math.PI / 2.1; 
      controls.target.set(0, 1, 0);

      // --- Lighting (Moonlight) ---
      // --- CHANGE: Brightened scene lighting a final time ---
      const ambientLight = new THREE.AmbientLight(0x404080, 2.0); // Increased intensity
      scene.add(ambientLight);
      const moonLight = new THREE.DirectionalLight(0xb0c4de, 4.0); // Increased intensity
      moonLight.position.set(-15, 20, -15);
      scene.add(moonLight);

      // --- Create Outdoor Environment ---
      const textureLoader = new THREE.TextureLoader();
      
      // Ground
      const groundTexture = textureLoader.load('https://cdn3.struffelproductions.com/file/ambientCG/media/sphere/1024-JPG-FFFFFF/Asphalt013_1K_Color.jpg', (texture) => {
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(20, 20);
        texture.anisotropy = 16;
      });
      const groundMaterial = new THREE.MeshStandardMaterial({
        map: groundTexture,
        roughness: 0.9,
        metalness: 0.1
      });
      const groundGeometry = new THREE.PlaneGeometry(200, 200);
      const ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Moon
      const moonGeometry = new THREE.SphereGeometry(3, 32, 32);
      const moonMaterial = new THREE.MeshBasicMaterial({ color: 0xfffde0, fog: false });
      const moon = new THREE.Mesh(moonGeometry, moonMaterial);
      moon.position.copy(moonLight.position).normalize().multiplyScalar(-150); // Place far away
      scene.add(moon);

      // Stars
      const starVertices = [];
      for (let i = 0; i < 10000; i++) {
        const x = THREE.MathUtils.randFloatSpread(2000);
        const y = THREE.MathUtils.randFloatSpread(2000);
        const z = THREE.MathUtils.randFloatSpread(2000);
        starVertices.push(x, y, z);
      }
      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
      const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, fog: false });
      stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);

      // Hazy Clouds
      const cloudTexture = textureLoader.load('https://threejs.org/examples/textures/cloud.png');
      const cloudGeo = new THREE.PlaneGeometry(500, 500);
      const cloudMaterial = new THREE.MeshLambertMaterial({
        map: cloudTexture,
        transparent: true,
        opacity: 0.2,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      for(let p=0; p<8; p++) {
        let cloud = new THREE.Mesh(cloudGeo, cloudMaterial);
        cloud.position.set(
          Math.random()*200 - 100,
          50 + Math.random()*20,
          -150 + Math.random()*100
        );
        cloud.rotation.x = Math.PI / 2;
        cloud.rotation.z = Math.random()*2*Math.PI;
        cloudParticles.push(cloud);
        scene.add(cloud);
      }

      // --- Loading Manager ---
      const loadingManager = new THREE.LoadingManager(
        () => {
          document.getElementById('loader').style.display = 'none';
          linkModels(); // Link characters to their cars after loading
          runRuntimeTests();
        },
        (url, itemsLoaded, itemsTotal) => {
          logDiag(`Loading ${itemsLoaded}/${itemsTotal}: ${url.split('/').pop()}`);
        },
        (url) => {
          failedURLs.add(url);
          logDiag(`⚠️ Failed to load: ${url}`);
        }
      );

      loadingManager.setURLModifier((url) => {
        if (/^(data:|blob:|https?:)/i.test(url)) return url;
        const cleaned = url.replace(/^\.\/?|^\//, '');
        return GITHUB_BASE + cleaned;
      });

      const loader = new GLTFLoader(loadingManager);
      loader.setCrossOrigin('anonymous');
      
      const ktx2 = new KTX2Loader(loadingManager).setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
      loader.setKTX2Loader(ktx2);
      const draco = new DRACOLoader(loadingManager).setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
      loader.setDRACOLoader(draco);
      loader.setMeshoptDecoder(MeshoptDecoder);

      // --- Load Models ---
      characters.forEach(char => {
        // Character model
        loader.load(char.file, (gltf) => {
          const model = gltf.scene;
          model.position.copy(char.position).add(char.characterOffset);
          model.scale.set(CHARACTER_BASE_SCALE, CHARACTER_BASE_SCALE, CHARACTER_BASE_SCALE);
          model.traverse(child => { if (child.isMesh) child.userData.parentGroup = model; });
          
          model.userData.isCharacter = true;
          model.userData.characterName = char.name;

          scene.add(model);
          models.push(model);
          loadedCharacters++;
        });

        // Car model
        if (char.carFile) {
          loader.load(char.carFile, (gltf) => {
            const carModel = gltf.scene;
            carModel.position.copy(char.position);
            const scale = 7.5; 
            carModel.scale.set(scale, scale, scale);

            carModel.userData.isCar = true;
            carModel.userData.characterName = char.name;

            createHeadlights(carModel, char.headlightPositions);

            scene.add(carModel);
            loadedCars++;
          });
        }
      });

      // --- Event Listeners ---
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();
      window.addEventListener('mousemove', onMouseMove, false);
      window.addEventListener('resize', onWindowResize, false);
    }

    function createHeadlights(carModel, positions) {
        const headlight1 = new THREE.SpotLight(0xffffff, 0, 30, Math.PI / 9, 0.5, 2);
        const headlight2 = new THREE.SpotLight(0xffffff, 0, 30, Math.PI / 9, 0.5, 2);

        const pos1 = positions[0];
        const pos2 = positions[1];
        headlight1.position.copy(pos1);
        headlight2.position.copy(pos2);

        const target1 = new THREE.Object3D();
        const target2 = new THREE.Object3D();
        target1.position.set(pos1.x, pos1.y - 0.2, pos1.z - 10);
        target2.position.set(pos2.x, pos2.y - 0.2, pos2.z - 10);
        
        carModel.add(headlight1, headlight1.target, headlight2, headlight2.target);
        headlight1.target = target1;
        headlight2.target = target2;

        const beamGeo = new THREE.ConeGeometry(1.5, 30, 32);
        beamGeo.translate(0, -15, 0); 
        beamGeo.rotateX(Math.PI / 2);
        const beamMat = new THREE.MeshBasicMaterial({
            color: 0xffffcc,
            transparent: true,
            opacity: 0.25,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const beam1 = new THREE.Mesh(beamGeo, beamMat);
        const beam2 = new THREE.Mesh(beamGeo, beamMat);
        
        beam1.position.copy(headlight1.position);
        beam2.position.copy(headlight2.position);
        beam1.visible = false;
        beam2.visible = false;
        carModel.add(beam1, beam2);

        carModel.userData.headlights = [headlight1, headlight2];
        carModel.userData.headlightBeams = [beam1, beam2];
    }

    function linkModels() {
        const cars = scene.children.filter(obj => obj.userData.isCar);
        models.forEach(characterModel => {
            const car = cars.find(c => c.userData.characterName === characterModel.userData.characterName);
            if (car) {
                characterModel.userData.carModel = car;
            }
        });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    }

    function checkHover() {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(models, true);

      hoveredObject = null;

      if (intersects.length > 0) {
        let current = intersects[0].object;
        while (current) {
            if (current.userData.parentGroup) {
                hoveredObject = current.userData.parentGroup;
                break;
            }
            current = current.parent;
        }
      }

      // Turn off all lights first
      models.forEach(model => {
          if (model.userData.carModel) {
              model.userData.carModel.userData.headlights.forEach(light => light.intensity = 0);
              model.userData.carModel.userData.headlightBeams.forEach(beam => beam.visible = false);
          }
      });

      // Then, turn on the lights for the hovered character and manage scaling
      models.forEach(model => {
        const targetScale = (model === hoveredObject) ? CHARACTER_HOVER_SCALE : CHARACTER_BASE_SCALE;
        model.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
        
        if (model === hoveredObject && model.userData.carModel) {
            model.userData.carModel.userData.headlights.forEach(light => light.intensity = 100);
            model.userData.carModel.userData.headlightBeams.forEach(beam => beam.visible = true);
        }
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update(); 
      checkHover();

      // Animate sky elements
      const time = Date.now() * 0.0001;
      stars.rotation.x = time * 0.1;
      stars.rotation.y = time * 0.1;
      
      cloudParticles.forEach(p => {
        p.rotation.z -= 0.001;
      });

      renderer.render(scene, camera);
    }

    function runRuntimeTests() {
      const results = [];
      results.push({ name: 'Viewer initialized', pass: !!(scene && camera && renderer) });
      results.push({ name: 'Characters loaded', pass: loadedCharacters === characters.length, extra: `${loadedCharacters}/${characters.length}` });
      const carTargets = characters.filter(c => !!c.carFile).length;
      results.push({ name: 'Cars loaded', pass: loadedCars === carTargets, extra: `${loadedCars}/${carTargets}` });
      results.push({ name: 'No resource failures', pass: failedURLs.size === 0, extra: failedURLs.size ? Array.from(failedURLs).slice(0, 3).join('\n') + (failedURLs.size > 3 ? `\n(+${failedURLs.size-3} more)` : '') : '' });
      
      const linkedModels = models.filter(m => m.userData.carModel).length;
      results.push({ name: 'Characters linked to cars', pass: linkedModels === carTargets, extra: `${linkedModels}/${carTargets}` });

      const lines = ['Runtime Tests:'];
      for (const r of results) {
        const status = r.pass ? '✅' : '❌';
        lines.push(`${status} ${r.name}${r.extra ? ` — ${r.extra}` : ''}`);
      }
      logDiag(lines.join('\n'));
    }
  </script>
</body>
</html>
