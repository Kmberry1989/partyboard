<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Street Race Character Selection</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }

        canvas {
            display: block;
        }

        #loader {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 24px;
            letter-spacing: 0.3px;
            background: #000;
            z-index: 10;
            transition: opacity 0.5s ease-out;
        }
        
        #title {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 100, 0, 0.5);
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        
        #character-name {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            font-weight: 500;
            text-transform: capitalize;
            background: rgba(0,0,0,0.4);
            padding: 0.5rem 1.5rem;
            border-radius: 1rem;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="loader">Loading Scene...</div>
    <div id="title">Choose Your Racer</div>
    <div id="character-name"></div>

    <!-- Three.js and add-ons via import map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
        import TWEEN from 'https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@23.1.1/dist/tween.esm.js';

        // --- Core Components ---
        let scene, camera, renderer, composer, bokehPass;
        const clock = new THREE.Clock();
        const models = [];
        let currentSelection = -1;
        let interactionDebounce = false;
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let cameraLookAtTarget = new THREE.Vector3(0, 1, 0);

        // --- DOM Elements ---
        const loaderEl = document.getElementById('loader');
        const titleEl = document.getElementById('title');
        const nameEl = document.getElementById('character-name');

        // --- Character Data ---
        // Coordinates interpreted as (X, Height, Depth) from user input
        const GITHUB_BASE = 'https://raw.githubusercontent.com/Kmberry1989/partyboard/main/players/';
        const characters = [
            { name: 'jonah', file: GITHUB_BASE + 'jonah.glb', carFile: GITHUB_BASE + 'jonah_toyota_scion.glb', position: new THREE.Vector3(-15, 0, 0), characterOffset: new THREE.Vector3(2, 0, 2.5), headlightPositions: [new THREE.Vector3(0.5387, 0.6314, 1.481), new THREE.Vector3(-0.5093, 0.6354, 1.533)] },
            { name: 'vickie', file: GITHUB_BASE + 'vickie.glb', carFile: GITHUB_BASE + 'vickie_chevrolet_sonic.glb', position: new THREE.Vector3(-5, 0, 0), characterOffset: new THREE.Vector3(2, 0, 2.5), headlightPositions: [new THREE.Vector3(0.5377, 0.6054, 1.53), new THREE.Vector3(-0.5623, 0.6054, 1.53)] },
            { name: 'rochelle', file: GITHUB_BASE + 'rochelle.glb', carFile: GITHUB_BASE + 'rochelle_ford_fusion.glb', position: new THREE.Vector3(5, 0, 0), characterOffset: new THREE.Vector3(2, 0, 2.5), headlightPositions: [new THREE.Vector3(0.5377, 0.6554, 1.53), new THREE.Vector3(-0.5623, 0.6554, 1.53)] },
            { name: 'kyle', file: GITHUB_BASE + 'kyle.glb', carFile: GITHUB_BASE + 'kyle_hyundai_elantra.glb', position: new THREE.Vector3(15, 0, 0), characterOffset: new THREE.Vector3(2, 0, 2.5), headlightPositions: [new THREE.Vector3(0.5623, 0.5854, 1.43), new THREE.Vector3(-0.5623, 0.5854, 1.43)] }
        ];

        init();
        animate();

        // --- Initialization ---
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 20, 50);

            // Camera setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 25); // Initial zoomed-out position

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404080, 2);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 3);
            dirLight.position.set(10, 15, 10);
            scene.add(dirLight);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8, metalness: 0.2 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Post-processing for blur effect
            setupPostProcessing();

            // Load assets
            loadAssets();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('wheel', onMouseWheel);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerdown', onPointerDown);
        }

        // --- Asset Loading ---
        function loadAssets() {
            const loadingManager = new THREE.LoadingManager(() => {
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.style.display = 'none', 500);
                startIntroAnimation();
            });
            const gltfLoader = new GLTFLoader(loadingManager);

            let loadedCount = 0;
            const totalAssets = characters.length * 2;

            characters.forEach((charData, index) => {
                const modelData = {
                    ...charData,
                    character: null,
                    car: null,
                    headlights: [],
                    smokeParticles: null,
                    rumble: { time: 0, intensity: 0 }
                };
                models.push(modelData);

                // Load character model
                gltfLoader.load(charData.file, (gltf) => {
                    const model = gltf.scene;
                    model.scale.setScalar(1.8);
                    model.position.copy(charData.position).add(charData.characterOffset);
                    model.name = `character_${index}`;
                    model.traverse(child => { if (child.isMesh) child.userData.characterIndex = index; });
                    scene.add(model);
                    modelData.character = model;
                    loadedCount++;
                    loaderEl.textContent = `Loading ${loadedCount}/${totalAssets}...`;
                });

                // Load car model
                gltfLoader.load(charData.carFile, (gltf) => {
                    const car = gltf.scene;
                    car.scale.setScalar(1.8);
                    car.position.copy(charData.position);
                    scene.add(car);
                    modelData.car = car;
                    
                    // Add headlights
                    charData.headlightPositions.forEach(pos => {
                        const light = new THREE.SpotLight(0xffffff, 0, 15, Math.PI / 5, 0.4, 2);
                        light.position.copy(pos);
                        light.target.position.set(pos.x, pos.y - 0.5, pos.z + 5);
                        car.add(light);
                        car.add(light.target);
                        modelData.headlights.push(light);
                    });

                    // Add smoke particles
                    modelData.smokeParticles = createSmokeSystem(car.position);
                    scene.add(modelData.smokeParticles);

                    loadedCount++;
                    loaderEl.textContent = `Loading ${loadedCount}/${totalAssets}...`;
                });
            });
        }

        // --- Effects ---
        function createSmokeSystem(position) {
            const particleCount = 100;
            const particles = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                posArray[i * 3] = position.x + (Math.random() - 0.5) * 0.5;
                posArray[i * 3 + 1] = position.y + Math.random() * 0.5;
                posArray[i * 3 + 2] = position.z - 2.5 + (Math.random() - 0.5) * 0.5;
                velocities.push(new THREE.Vector3((Math.random() - 0.5) * 0.02, Math.random() * 0.02 + 0.01, (Math.random() - 0.5) * 0.02));
            }
            particles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particles.userData.velocities = velocities;
            particles.userData.origin = position.clone();

            const smokeTexture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/cloud.png');
            const particleMaterial = new THREE.PointsMaterial({
                size: 1.5,
                map: smokeTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0,
            });

            const particleSystem = new THREE.Points(particles, particleMaterial);
            particleSystem.visible = false;
            return particleSystem;
        }
        
        function setupPostProcessing() {
            composer = new EffectComposer(renderer);
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            bokehPass = new BokehPass(scene, camera, {
                focus: 10.0,
                aperture: 0.0005,
                maxblur: 0.01,
                width: window.innerWidth,
                height: window.innerHeight
            });
            bokehPass.enabled = false;
            composer.addPass(bokehPass);
        }

        // --- Animations & Transitions ---
        function startIntroAnimation() {
            setTimeout(() => {
                titleEl.style.opacity = '1';
                // Zoom in and focus on the first character
                selectCharacter(0, true);
            }, 2000); // Start after 2 seconds
        }

        function selectCharacter(index, isInitial = false) {
            if (index === currentSelection && !isInitial) return;
            
            currentSelection = index;

            // Update UI
            nameEl.style.opacity = '0';
            nameEl.style.transform = `translateX(-50%) translateY(20px)`;
            setTimeout(() => {
                const name = models[currentSelection].name;
                nameEl.textContent = name.charAt(0).toUpperCase() + name.slice(1);
                nameEl.style.opacity = '1';
                nameEl.style.transform = `translateX(-50%) translateY(0)`;
            }, 300);

            // --- Camera Animation on a Track ---
            const duration = isInitial ? 1500 : 750;
            const easing = TWEEN.Easing.Quadratic.InOut;

            // Target for camera position
            const cameraTargetPos = models[currentSelection].position.clone().add(new THREE.Vector3(0, 2, 8));
            new TWEEN.Tween(camera.position)
                .to(cameraTargetPos, duration)
                .easing(easing)
                .start();

            // Target for camera to look at
            const lookAtTargetPos = models[currentSelection].position.clone().add(new THREE.Vector3(0, 1, 0));
            new TWEEN.Tween(cameraLookAtTarget)
                .to(lookAtTargetPos, duration)
                .easing(easing)
                .start();
            
            // Update effects for all models
            models.forEach((model, i) => {
                const isSelected = i === currentSelection;
                
                // Headlights
                model.headlights.forEach(light => {
                    new TWEEN.Tween(light)
                        .to({ intensity: isSelected ? 150 : 0 }, 500)
                        .start();
                });

                // Smoke
                if (model.smokeParticles) {
                    model.smokeParticles.visible = isSelected;
                    new TWEEN.Tween(model.smokeParticles.material)
                        .to({ opacity: isSelected ? 0.4 : 0 }, 500)
                        .start();
                }

                // Car Rumble
                if (isSelected) {
                    model.rumble.time = 0;
                    model.rumble.intensity = 0.01;
                }
            });

            // Update blur effect
            bokehPass.enabled = true;
            new TWEEN.Tween(bokehPass.uniforms.focus)
                .to({ value: camera.position.distanceTo(lookAtTargetPos) }, duration)
                .easing(easing)
                .start();
        }

        // --- Main Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            
            TWEEN.update();

            // Always update camera lookAt for smooth tracking
            camera.lookAt(cameraLookAtTarget);

            models.forEach((model, i) => {
                // Player pulsing
                if (i === currentSelection && model.character) {
                    const scale = 1.8 + Math.sin(elapsedTime * 5) * 0.05;
                    model.character.scale.setScalar(scale);
                } else if (model.character) {
                    model.character.scale.lerp(new THREE.Vector3(1.8, 1.8, 1.8), 0.1);
                }

                // Car rumble effect
                if (model.rumble.intensity > 0 && model.car) {
                    model.rumble.time += delta;
                    model.car.position.x += (Math.random() - 0.5) * model.rumble.intensity * 0.1;
                    model.car.position.y += (Math.random() - 0.5) * model.rumble.intensity * 0.05;
                    model.rumble.intensity = Math.max(0, model.rumble.intensity - delta * 0.005);
                } else if (model.car && model.position) { // FIX: Added check for model.position
                    // Smoothly return to original rotation/position
                    model.car.position.x = THREE.MathUtils.lerp(model.car.position.x, model.position.x, 0.1);
                    model.car.position.y = THREE.MathUtils.lerp(model.car.position.y, model.position.y, 0.1);
                }

                // Smoke animation
                if (model.smokeParticles && model.smokeParticles.visible) {
                    const positions = model.smokeParticles.geometry.attributes.position.array;
                    const velocities = model.smokeParticles.geometry.userData.velocities;
                    const origin = model.smokeParticles.userData.origin;

                    for (let i = 0; i < velocities.length; i++) {
                        positions[i * 3] += velocities[i].x;
                        positions[i * 3 + 1] += velocities[i].y;
                        positions[i * 3 + 2] += velocities[i].z;

                        if (positions[i * 3 + 1] > 3) {
                            positions[i * 3] = origin.x + (Math.random() - 0.5) * 0.5;
                            positions[i * 3 + 1] = origin.y + Math.random() * 0.5;
                            positions[i * 3 + 2] = origin.z - 2.5 + (Math.random() - 0.5) * 0.5;
                        }
                    }
                    model.smokeParticles.geometry.attributes.position.needsUpdate = true;
                }
            });

            composer.render();
        }

        // --- Event Handlers ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseWheel(event) {
            if (interactionDebounce) return;
            interactionDebounce = true;

            const direction = Math.sign(event.deltaY);
            let newIndex = currentSelection + direction;

            if (newIndex >= characters.length) newIndex = 0;
            if (newIndex < 0) newIndex = characters.length - 1;

            selectCharacter(newIndex);

            setTimeout(() => { interactionDebounce = false; }, 500); // Increased debounce for smoother feel
        }

        function onPointerMove(event) {
            if (interactionDebounce) return;
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            const intersectedChar = intersects.find(
                intersect => intersect.object.userData.characterIndex !== undefined
            );

            if (intersectedChar) {
                const index = intersectedChar.object.userData.characterIndex;
                if (index !== currentSelection) {
                    interactionDebounce = true;
                    selectCharacter(index);
                    setTimeout(() => { interactionDebounce = false; }, 500); // Increased debounce for smoother feel
                }
            }
        }
        
        function onPointerDown(event) {
             onPointerMove(event); // Reuse hover logic for taps/clicks
        }

    </script>
</body>
</html>
